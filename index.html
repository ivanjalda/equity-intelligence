<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Equity Intelligence | Valor intrínseco y plazos de inversión</title>
<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<script>window.LightweightCharts||document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/lightweight-charts/4.1.3/lightweight-charts.standalone.production.js"><\/script>')</script>
<style>
:root{--bg:#0b0e14;--p:#131722;--p2:#1e222d;--gold:#d4af37;--t:#d1d4dc;--w:#fff;--m:#8a8d98;--b:#2a2e39;--g:#089981;--r:#f23645;--y:#c58b00}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--t);font:14px/1.5 -apple-system,Roboto,"Segoe UI",sans-serif}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 20px;background:var(--p);border-bottom:1px solid var(--b)}
.brand{color:var(--gold);font-weight:800;letter-spacing:1px}
.brand small{display:block;color:var(--m);font-weight:400;letter-spacing:0;font-size:11px}
.btn{background:var(--bg);border:1px solid var(--b);color:var(--m);padding:5px 11px;border-radius:5px;cursor:pointer;font-size:12px}
.btn.on{background:var(--gold);color:#000;border-color:var(--gold);font-weight:700}
.layout{display:grid;grid-template-columns:310px 1fr 320px;height:calc(100vh - 54px)}
aside,main{overflow-y:auto;padding:14px}
aside{background:var(--p)}
.l{border-right:1px solid var(--b)}.r{border-left:1px solid var(--b)}
input{width:100%;padding:9px 11px;background:var(--bg);border:1px solid var(--b);border-radius:6px;color:var(--w);margin-bottom:10px}
.row{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px}
.card{background:var(--p2);border:1px solid var(--b);border-radius:6px;padding:9px 11px;margin-bottom:7px;cursor:pointer}
.card:hover{border-color:var(--gold)}
.flex{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sm{font-size:12px;color:var(--m)}
.badge{font-size:11px;padding:2px 8px;border-radius:4px;font-weight:700;color:#fff;white-space:nowrap}
.COMPRAR{background:var(--g)}.ESPERAR{background:var(--y);color:#000}.CARO{background:var(--r)}.NA{background:var(--b);color:var(--m)}
.box{background:var(--p);border:1px solid var(--b);border-radius:8px;padding:18px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:14px 0}
.m{background:var(--p2);border:1px solid var(--b);border-radius:6px;padding:10px;text-align:center}
.m small{display:block;color:var(--m);font-size:12px}.m strong{font-size:18px;color:var(--w)}
h2,h3{margin:0 0 8px;color:var(--gold)}h3{font-size:14px}
.chart{height:380px;margin:8px 0}
table{width:100%;border-collapse:collapse;font-size:12px}
td,th{padding:6px 7px;border-bottom:1px solid var(--b);text-align:left}th{color:var(--m);font-weight:400}
.up{color:var(--g)}.dn{color:var(--r)}
.note{background:var(--p2);border-left:3px solid var(--gold);padding:10px 12px;border-radius:4px;margin:12px 0}
@media(max-width:1100px){.layout{grid-template-columns:270px 1fr}.r{display:none}}
@media(max-width:700px){.layout{grid-template-columns:1fr;height:auto}}
</style>
</head>
<body>
<header>
  <div class="brand">Equity Intelligence<small id="upd">Cargando datos…</small></div>
  <div class="row" style="margin:0">
    <button class="btn on" id="tTerm" onclick="vista('term')">Terminal</button>
    <button class="btn" id="tFund" onclick="vista('fund')">Grandes fondos</button>
    <button class="btn" id="tHist" onclick="vista('hist')">Historial de señales</button>
  </div>
</header>

<div id="vTerm" class="layout">
  <aside class="l">
    <input id="q" placeholder="Buscar ticker o nombre">
    <div class="sm">Veredicto</div>
    <div class="row" id="fVer"></div>
    <div class="sm">Tipo de activo</div>
    <div class="row" id="fCat"></div>
    <div class="sm">Plazo de inversión</div>
    <div class="row" id="fHor"></div>
    <div class="row"><button class="btn" id="fCic" onclick="toggleCic()">Solo cíclicas</button></div>
    <div id="list"></div>
  </aside>
  <main id="main"></main>
  <aside class="r"><div id="f13"></div></aside>
</div>

<main id="vHist" style="display:none"></main>
<main id="vFund" style="display:none"></main>

<script>
const D={m:{},v:{items:{}},s:[],f:null,h:{}};
let cat="TODOS",hor="TODOS",ver="COMPRAR",cic=false;
const VERS=["COMPRAR","ESPERAR","CARO","TODAS"];
const VT={COMPRAR:"Oportunidades de compra",ESPERAR:"Mejor esperar",CARO:"Caras ahora",TODAS:"Todas las acciones"};
const CATS=["TODOS","ACCIONES","ETFS","COMMODITIES","BONOS"];
const HORS=["TODOS","corto","medio","largo"];
const LBL={COMPRAR:"Comprar",ESPERAR:"Esperar",CARO:"Caro",TODAS:"Todas",TODOS:"Todo",ACCIONES:"Acciones",ETFS:"Índices / ETFs",COMMODITIES:"Materias primas",BONOS:"Bonos",corto:"Corto plazo",medio:"Medio plazo",largo:"Largo plazo"};
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const j=async u=>{try{const r=await fetch(u,{cache:"no-store"});return r.ok?await r.json():null}catch(e){return null}};
const num=(x,d=2)=>typeof x==="number"?x.toLocaleString("es-ES",{minimumFractionDigits:d,maximumFractionDigits:d}):"—";

async function init(){
  D.m=await j("data/market-data.json")||{};
  D.v=await j("data/valuations.json")||{items:{}};
  D.s=await j("data/signals.json")||[];
  D.f=await j("data/13f.json");
  document.getElementById("upd").textContent=D.v.updated?"Datos al cierre de mercado · actualizado "+D.v.updated:"Sin datos cargados todavía";
  const mk=(id,arr,get,set)=>{const e=document.getElementById(id);e.innerHTML="";arr.forEach(k=>{const b=document.createElement("button");b.className="btn"+(get()===k?" on":"");b.textContent=LBL[k];b.onclick=()=>{set(k);mk(id,arr,get,set);lista()};e.appendChild(b)})};
  mk("fVer",VERS,()=>ver,k=>ver=k);mk("fCat",CATS,()=>cat,k=>cat=k);mk("fHor",HORS,()=>hor,k=>hor=k);
  document.getElementById("q").oninput=()=>lista();
  lista();panel13f();
  const best=tickers().map(t=>[t,calc(t)]).filter(x=>x[1]&&x[1].verdict==="COMPRAR").sort((a,b)=>rkOf(b[1])-rkOf(a[1]))[0];
  best?detalle(best[0]):inicio();
}
function toggleCic(){cic=!cic;document.getElementById("fCic").classList.toggle("on",cic);lista()}

function calc(t){
  const v=D.v.items?.[t],p=D.m[t]?.c;
  if(!v||!p)return null;
  const ms=[v.dcf,v.graham,v.multiples].filter(x=>typeof x==="number"&&x>0);
  if(!ms.length)return null;
  const iv=ms.reduce((a,b)=>a+b,0)/ms.length,mg=(iv-p)/iv*100;
  const weak=mg>=25&&v.health==="Frágil",odd=mg>70;
  const verdict=mg>=25&&!weak&&!odd?"COMPRAR":mg>=0?"ESPERAR":"CARO";
  const spr=Math.max(...ms)/Math.min(...ms);
  return{iv,mg,verdict,entry:iv*0.75,n:ms.length,p,v,weak,odd,spr};
}
const rkOf=c=>c?Math.min(c.mg,50)*(c.v.health==="Sólida"?1:.75)*(c.spr<1.5?1:c.spr<2.2?.85:.65)*(c.v.cyclical?.85:1):-999;
function tickers(){return [...new Set([...Object.keys(D.m),...Object.keys(D.v.items||{})])].filter(t=>!t.startsWith("_"))}
let LIM=40;
function lista(keep){
  if(!keep)LIM=40;
  const q=document.getElementById("q").value.toUpperCase().trim(),el=document.getElementById("list");
  const useVer=!q&&(cat==="TODOS"||cat==="ACCIONES");
  const rows=[];
  tickers().forEach(t=>{
    const v=D.v.items?.[t]||{},type=v.type||D.m[t]?.type||"ACCIONES";
    if(cat!=="TODOS"&&type!==cat)return;
    if(hor!=="TODOS"&&v.horizon!==hor)return;
    if(cic&&!v.cyclical)return;
    if(q&&!t.includes(q)&&!(v.name||"").toUpperCase().includes(q))return;
    const c=calc(t);
    if(useVer&&ver!=="TODAS"&&(!c||c.verdict!==ver))return;
    rows.push({t,v,c});
  });
  const rk=r=>rkOf(r.c);
  rows.sort((a,b)=>q?(b.t.startsWith(q)-a.t.startsWith(q)||a.t.localeCompare(b.t)):(rk(b)-rk(a)||a.t.localeCompare(b.t)));
  el.innerHTML=`<div class="sm" style="margin-bottom:6px">${q?"Resultados de la búsqueda ("+rows.length+")":useVer?VT[ver]+" ("+rows.length+")":LBL[cat]+" ("+rows.length+")"}</div>`;
  rows.slice(0,LIM).forEach(({t,v,c})=>{
    const d=document.createElement("div");d.className="card";
    d.innerHTML=`<div class="flex"><strong>${esc(t)}</strong><span>${D.m[t]?"$"+num(D.m[t].c):"—"}</span></div>
    <div class="flex sm"><span>${esc(v.name||"")}${v.cyclical?" · cíclica":""}${v.health?" · salud "+esc(v.health.toLowerCase()):""}</span><span class="badge ${c?c.verdict:"NA"}">${c?c.verdict:"Sin valorar"}</span></div>`;
    d.onclick=()=>detalle(t);el.appendChild(d);
  });
  if(rows.length>LIM){const b=document.createElement("button");b.className="btn";b.style.width="100%";b.textContent=`Mostrar más (${rows.length-LIM} restantes)`;b.onclick=()=>{LIM+=40;lista(true)};el.appendChild(b)}
  if(!rows.length)el.innerHTML+=q?'<p class="sm">Ningún activo coincide con la búsqueda.</p>':'<p class="sm">No hay activos con estos filtros. Prueba otro veredicto o usa el buscador.</p>';
}
function inicio(){
  const idx=["SPY","QQQ","DIA","IWM"].filter(t=>D.m[t]);
  document.getElementById("main").innerHTML=`<div class="box"><h2>¿Dónde invertir?</h2>
  <p class="sm">Elige un activo. Verás su valor intrínseco calculado con tres métodos, el margen de seguridad y a qué precio conviene entrar.</p>
  ${idx.length?`<div class="grid">${idx.map(t=>`<div class="m"><small>${t}</small><strong>$${num(D.m[t].c)}</strong></div>`).join("")}</div>`:'<div class="note">Todavía no hay precios. Comprueba que existe <code>data/market-data.json</code> y que el workflow se ejecutó sin errores.</div>'}
  <h3>Cómo leer el veredicto</h3>
  <table><tr><td><span class="badge COMPRAR">COMPRAR</span></td><td>Cotiza al menos un 25 % por debajo de su valor intrínseco.</td></tr>
  <tr><td><span class="badge ESPERAR">ESPERAR</span></td><td>Está cerca de su valor justo. Te decimos el precio de entrada y cuándo revisarlo.</td></tr>
  <tr><td><span class="badge CARO">CARO</span></td><td>Cotiza por encima de su valor intrínseco.</td></tr></table></div>`;
}

function detalle(t){
  const c=calc(t),v=D.v.items?.[t]||{},p=D.m[t]?.c,main=document.getElementById("main");
  let h=`<div class="box"><div class="flex"><div><h2>${esc(t)} <span class="sm">${esc(v.name||"")}</span></h2>
  <div class="sm">${v.cyclical?"Empresa cíclica · se valora con beneficios medios de varios años":"Empresa no cíclica"}${v.horizon?" · plazo ideal: "+esc(v.horizon):""}</div></div>
  <span class="badge ${c?c.verdict:"NA"}" style="font-size:13px;padding:5px 12px">${c?c.verdict:"Sin valorar"}</span></div>
  <div class="grid"><div class="m"><small>Precio</small><strong>${p?"$"+num(p):"—"}</strong></div>
  <div class="m"><small>Valor intrínseco</small><strong style="color:var(--gold)">${c?"$"+num(c.iv):"—"}</strong></div>
  <div class="m"><small>Margen de seguridad</small><strong class="${c&&c.mg>=0?"up":"dn"}">${c?num(c.mg,1)+" %":"—"}</strong></div>
  ${c&&c.n>1?`<div class="m"><small>Acuerdo entre métodos</small><strong class="${c.spr<1.5?"up":c.spr<2.2?"":"dn"}">${c.spr<1.5?"Alto":c.spr<2.2?"Medio":"Bajo"}</strong><small>el más alto es ×${num(c.spr,1)} el más bajo</small></div>`:""}</div>`;
  if(c){
    h+=`<div class="note"><strong>${c.verdict==="COMPRAR"?"Zona de compra.":c.verdict==="ESPERAR"?"Mejor esperar.":"Caro ahora."}</strong> `;
    if(c.verdict==="COMPRAR")h+=`El precio ya ofrece un margen de seguridad suficiente.`;
    else h+=`${c.weak?"Parece barata en números, pero su salud financiera es frágil. ":""}${c.odd?"La diferencia con su valor es tan grande que puede deberse a un dato atípico: verifícalo antes de actuar. ":""}Precio de entrada recomendado: <strong>$${num(c.entry)}</strong> (25 % bajo el valor intrínseco).${v.review?` Próxima revisión: <strong>${esc(v.review)}</strong>${v.review_reason?" ("+esc(v.review_reason)+")":""}.`:""}`;
    h+=` Valor calculado con ${c.n} de 3 métodos. No es asesoramiento financiero.</div>`;
  }
  if(!c&&v.kind==="financiera")h+=`<div class="note">Los bancos, aseguradoras, fondos e inmobiliarias se valoran con otros métodos (valor contable, dividendos…). Todavía no los incluimos, así que no damos veredicto para evitar un número engañoso.</div>`;
  h+=`<div id="drop"></div>`;
  h+=`<div class="flex"><h3>Cotización</h3><div class="row" id="rng" style="margin:0"></div></div><div id="chart" class="chart"></div>`;
  if(c)h+=`<h3>Tres formas de calcular el valor intrínseco</h3><table>
  <tr><th>Método</th><th>Qué hace</th><th>Valor</th></tr>
  <tr><td>Flujo de caja descontado</td><td class="sm">Estima el dinero libre futuro y lo trae a valor de hoy.</td><td>${v.dcf?"$"+num(v.dcf):"—"}</td></tr>
  <tr><td>Fórmula de Graham</td><td class="sm">Beneficio por acción y crecimiento esperado.</td><td>${v.graham?"$"+num(v.graham):"—"}</td></tr>
  <tr><td>Múltiplos históricos</td><td class="sm">PER medio de los últimos años por el beneficio actual.</td><td>${v.multiples?"$"+num(v.multiples):"—"}</td></tr></table>`;
  h+=`<h3 style="margin-top:18px">Salud de la empresa · últimos 5 años</h3><div id="fund" class="sm">Cargando cuentas…</div>`;
  h+=holders(t);
  if(v.ratios&&Object.keys(v.ratios).length)h+=`<h3 style="margin-top:16px">Ratios</h3><table>${Object.entries(v.ratios).map(([k,x])=>`<tr><td class="sm">${esc(k)}</td><td>${esc(x)}</td></tr>`).join("")}</table>`;
  main.innerHTML=h+"</div>";
  grafico(t);fundamentos(t);
}
async function grafico(t){
  const el=document.getElementById("chart");
  if(typeof LightweightCharts==="undefined"){el.innerHTML='<p class="sm">No se pudo cargar la librería del gráfico. Recarga la página con Ctrl+F5.</p>';return}
  if(D.h[t]===undefined)D.h[t]=await j(`data/history/${t}.json`);
  const raw=D.h[t];
  if(!raw||!raw.length){el.innerHTML='<p class="sm">Histórico no disponible todavía para este activo.</p>';return}
  const data=raw.map(([d,x])=>({time:d,value:x}));
  const lastT=new Date(data[data.length-1].time),yr=data.filter(x=>new Date(x.time)>=new Date(lastT-365*864e5));
  const drop=(1-data[data.length-1].value/Math.max(...yr.map(x=>x.value)))*100,wd=document.getElementById("drop");
  if(wd&&drop>=35)wd.innerHTML=`<div class="note" style="border-color:var(--y)">⚠ El precio ha caído un ${num(drop,0)} % desde su máximo del último año. A veces el mercado ve algo que las cuentas todavía no reflejan: conviene entender el motivo antes de actuar.</div>`;
  const chart=LightweightCharts.createChart(el,{autoSize:true,layout:{background:{color:"#0b0e14"},textColor:"#d1d4dc"},grid:{vertLines:{visible:false},horzLines:{color:"#1e222d"}},rightPriceScale:{borderColor:"#2a2e39"},timeScale:{borderColor:"#2a2e39"},crosshair:{mode:0}});
  const up=data[data.length-1].value>=data[0].value,col=up?"#81c995":"#f28b82";
  const cv=calc(t);
  const s=chart.addAreaSeries({autoscaleInfoProvider:o=>{const r=o();if(r&&cv){r.priceRange.maxValue=Math.max(r.priceRange.maxValue,cv.iv*1.03);r.priceRange.minValue=Math.min(r.priceRange.minValue,cv.entry*0.97)}return r},lineColor:col,topColor:up?"rgba(129,201,149,.30)":"rgba(242,139,130,.30)",bottomColor:"rgba(0,0,0,0)",lineWidth:2});
  if(cv){
    s.createPriceLine({price:cv.iv,color:"#d4af37",lineWidth:1,lineStyle:2,axisLabelVisible:true,title:"Valor intrínseco"});
    s.createPriceLine({price:cv.entry,color:"#089981",lineWidth:1,lineStyle:2,axisLabelVisible:true,title:"Entrada (-25 %)"});
  }
  const R={"1M":30,"6M":182,"YTD":0,"1A":365,"5A":1826,"Máx.":99999};
  const set=k=>{
    const last=new Date(data[data.length-1].time);
    const from=k==="YTD"?new Date(last.getFullYear(),0,1):new Date(last-R[k]*864e5);
    const f=data.filter(x=>new Date(x.time)>=from);
    s.setData(f.length>1?f:data);chart.timeScale().fitContent();
    [...document.getElementById("rng").children].forEach(b=>b.classList.toggle("on",b.textContent===k));
  };
  const rng=document.getElementById("rng");
  Object.keys(R).forEach(k=>{const b=document.createElement("button");b.className="btn";b.textContent=k;b.onclick=()=>set(k);rng.appendChild(b)});
  set("1A");
}

async function fundamentos(t){
  const el=document.getElementById("fund");if(!el)return;
  const f=await j(`data/fundamentals/${t}.json`);
  if(!f){el.innerHTML='<p class="sm">Las cuentas de la empresa no están disponibles para este activo.</p>';return}
  const bad=new Set(["Pasivos totales","Pasivo corriente","Deuda a largo plazo"]);
  const fmt=v=>v==null?"—":Math.abs(v)>=1000?"$"+num(v/1000,1)+" mil M":"$"+num(v,0)+" M";
  const spark=a=>{const v=a.map(x=>x??0),mx=Math.max(...v.map(Math.abs),1);return `<svg width="${v.length*18}" height="30">${v.map((x,i)=>{const hh=Math.max(1.5,26*Math.abs(x)/mx);return `<rect x="${i*18+2}" y="${28-hh}" width="14" height="${hh}" rx="2" fill="${x<0?"#f23645":"#5b6b8c"}"/>`}).join("")}</svg>`};
  const ico={ok:'<span class="up">✔</span>',warn:'<span style="color:var(--y)">⚠</span>',bad:'<span class="dn">✖</span>'};
  const col={"Sólida":"COMPRAR","Aceptable":"ESPERAR","Frágil":"CARO"}[f.health]||"NA";
  const cards=Object.entries(f.series).map(([k,a])=>{
    const nn=a.filter(x=>x!=null),first=nn[0],last=nn[nn.length-1];
    const ch=first>0&&last!=null?(last/first-1)*100:null,good=ch==null?null:(bad.has(k)?ch<=0:ch>=0);
    return `<div class="m" style="text-align:left"><small>${esc(k)}</small><strong style="font-size:16px">${fmt(last)}</strong>
    ${ch!==null?`<div class="${good?"up":"dn"}" style="font-size:12px">${ch>=0?"▲":"▼"} ${num(Math.abs(ch),0)} % en ${f.years.length-1} años</div>`:""}
    ${spark(a)}<div class="sm" style="font-size:11px">${esc(f.hints[k]||"")}</div></div>`}).join("");
  el.innerHTML=`<div class="flex" style="margin-bottom:8px"><span>Lectura rápida</span><span class="badge ${col}">Salud: ${esc(f.health)}</span></div>
  ${f.insights.map(i=>`<div style="margin:4px 0">${ico[i.t]} ${esc(i.x)}</div>`).join("")}
  <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(190px,1fr))">${cards}</div>
  <div class="sm">Años: ${f.years.map(esc).join(" · ")}. Cifras anuales oficiales (SEC), en dólares. M = millones.</div>`;
}
function panel13f(){
  const f=D.f,el=document.getElementById("f13");
  if(!f||!f.top||!f.top.length){el.innerHTML='<div class="box"><h3>Grandes fondos (13F)</h3><p class="sm">Todavía no hay datos 13F cargados. Se generan desde la SEC (EDGAR).</p></div>';return}
  const tb=(a,k)=>a&&a.length?`<table><tr><th>Valor</th><th>${k}</th></tr>${a.map(x=>`<tr><td><strong>${esc(x.ticker||"")}</strong> <span class="sm">${esc(x.name||"")}</span></td><td>${esc(x.funds)} de ${esc(f.total)}</td></tr>`).join("")}</table>`:"";
  el.innerHTML=`<div class="box"><h3>Grandes fondos (13F)</h3>
  <p class="sm">Informes del trimestre ${esc(f.quarter)}, presentados hasta el ${esc(f.filed)}. Llegan con hasta 45 días de retraso y solo cubren acciones de EE. UU. Fuente: SEC.</p>
  <h3 style="margin-top:12px">Más presentes en las carteras</h3>${tb(f.top,"Fondos")}
  <h3 style="margin-top:12px">Compras del trimestre</h3>${tb(f.buys,"Fondos")}
  <h3 style="margin-top:12px">Ventas del trimestre</h3>${tb(f.sells,"Fondos")}
  <button class="btn" style="width:100%;margin-top:10px" onclick="vista('fund')">Ver todas las carteras →</button></div>`;
}
function holders(t){
  const f=D.f;if(!f||!f.managers)return"";
  const r=[];f.managers.forEach(m=>{const p=m.positions.find(x=>x.ticker===t);if(p)r.push([m,p])});
  if(!r.length)return"";
  return `<h3 style="margin-top:16px">Grandes fondos que la tienen</h3><table>${r.map(([m,p])=>`<tr><td>${esc(m.name)} <span class="sm">· ${esc(m.who)}</span></td><td>${num(p.pct,1)} % de su cartera</td><td class="sm">${p.action==="nuevo"?"Compra nueva":p.action==="igual"?"Sin cambios":(p.action==="compra"?"Ha comprado más (+":"Ha vendido (−")+num(Math.abs(p.delta||0),0)+" %)"}</td></tr>`).join("")}</table><p class="sm">Informes 13F a ${esc(r[0][0].period)}, con hasta 45 días de retraso.</p>`;
}
function fondos(){
  const f=D.f,el=document.getElementById("vFund");
  if(!f||!f.managers||!f.managers.length){el.innerHTML='<div class="box"><h2>Grandes fondos</h2><p class="sm">Todavía no hay datos de los informes 13F.</p></div>';return}
  const usd=v=>v>=1e9?"$"+num(v/1e9,1)+" mil M":"$"+num(v/1e6,0)+" M";
  const chg=p=>p.action==="nuevo"?'<span class="badge COMPRAR">Nuevo</span>':p.action==="igual"?'<span class="sm">Sin cambios</span>':p.action==="compra"?`<span class="up">▲ ${num(Math.abs(p.delta),0)} %</span>`:`<span class="dn">▼ ${num(Math.abs(p.delta),0)} %</span>`;
  const link=p=>p.ticker&&D.m[p.ticker]?`<a href="#" onclick="vista('term');detalle('${esc(p.ticker)}');return false" style="color:var(--gold)">${esc(p.ticker)}</a>`:`<strong>${esc(p.ticker||"—")}</strong>`;
  el.innerHTML=`<div class="box"><h2>Grandes fondos · informes 13F</h2>
  <p class="sm">Qué tienen en cartera los grandes inversores y qué han comprado o vendido respecto al trimestre anterior. Los informes llegan con hasta 45 días de retraso, solo incluyen acciones de EE. UU. y no muestran ventas en corto. Fuente: SEC.</p>
  ${f.managers.map(m=>`<details style="margin:8px 0;border:1px solid var(--b);border-radius:6px;padding:8px 12px"><summary style="cursor:pointer"><strong>${esc(m.name)}</strong> <span class="sm">· ${esc(m.who)} · cartera ${usd(m.value)} · ${m.count} posiciones · informe a ${esc(m.period)}</span></summary>
  <div style="overflow-x:auto"><table style="margin-top:8px"><tr><th>Valor</th><th>Empresa</th><th>% de la cartera</th><th>Cambio vs. trimestre anterior</th><th>Importe</th></tr>
  ${m.positions.map(p=>`<tr><td>${link(p)}</td><td class="sm">${esc(p.name)}</td><td>${num(p.pct,1)} %</td><td>${chg(p)}</td><td>${usd(p.value)}</td></tr>`).join("")}</table></div>
  ${m.sold&&m.sold.length?`<p class="sm">Posiciones vendidas por completo: ${m.sold.map(s=>esc(s.ticker||s.name)).join(", ")}</p>`:""}</details>`).join("")}</div>`;
}
function vista(v){
  document.getElementById("vTerm").style.display=v==="term"?"grid":"none";
  document.getElementById("vHist").style.display=v==="hist"?"block":"none";
  document.getElementById("vFund").style.display=v==="fund"?"block":"none";
  [["tTerm","term"],["tHist","hist"],["tFund","fund"]].forEach(([i,k])=>document.getElementById(i).classList.toggle("on",v===k));
  if(v==="hist")historial();if(v==="fund")fondos();
}
function historial(){
  const el=document.getElementById("vHist"),S=D.s||[];
  if(!S.length){el.innerHTML='<div class="box"><h2>Historial de señales</h2><p class="sm">Aún no hay señales registradas. Cada veredicto se guardará con su fecha y precio, y se comparará con el S&amp;P 500. No hay datos simulados del pasado.</p></div>';return}
  const spy=D.m.SPY?.c;
  const rows=S.map(s=>{const p=D.m[s.ticker]?.c;const r=p?(p/s.price-1)*100:null;const b=spy&&s.spy?(spy/s.spy-1)*100:null;return{...s,p,r,b}});
  const ok=rows.filter(x=>x.r!==null),avg=ok.reduce((a,x)=>a+x.r,0)/(ok.length||1);
  const okb=ok.filter(x=>x.b!==null),avgb=okb.reduce((a,x)=>a+x.b,0)/(okb.length||1);
  const c=x=>x===null?"—":`<span class="${x>=0?"up":"dn"}">${num(x,1)} %</span>`;
  el.innerHTML=`<div class="box"><h2>Historial de señales</h2>
  <p class="sm">Cada señal se registró el día que se emitió. Los resultados no se editan.</p>
  <div class="grid"><div class="m"><small>Señales</small><strong>${S.length}</strong></div>
  <div class="m"><small>Rend. medio</small><strong>${num(avg,1)} %</strong></div>
  <div class="m"><small>S&amp;P 500, mismas fechas</small><strong>${okb.length?num(avgb,1)+" %":"—"}</strong></div></div>
  <div style="overflow-x:auto"><table><tr><th>Fecha</th><th>Activo</th><th>Veredicto</th><th>Precio entonces</th><th>Precio hoy</th><th>Rendimiento</th><th>S&amp;P 500</th></tr>
  ${rows.map(x=>`<tr><td>${esc(x.date)}</td><td><strong>${esc(x.ticker)}</strong></td><td><span class="badge ${esc(x.verdict)}">${esc(x.verdict)}</span></td><td>$${num(x.price)}</td><td>${x.p?"$"+num(x.p):"—"}</td><td>${c(x.r)}</td><td>${c(x.b)}</td></tr>`).join("")}</table></div></div>`;
}
init();
</script>
</body>
</html>
