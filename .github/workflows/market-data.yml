```yaml
name: Actualizar datos de mercado

'on':
  workflow_dispatch:
  schedule:
    - cron: '30 22 * * 1-5'

permissions:
  contents: write

jobs:
  update-market-data:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Comprobar archivos
        run: |
          echo "Comprobando estructura del proyecto..."
          test -f scripts/update_market_data.py
          mkdir -p data

      - name: Consultar datos de mercado
        env:
          POLYGON_KEY: ${{ secrets.POLYGON_KEY }}
        run: python scripts/update_market_data.py

      - name: Validar archivo JSON
        run: python -m json.tool data/market-data.json > /dev/null

      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market-data.json
          if ! git diff --cached --quiet; then
            git commit -m "Actualizar datos de mercado"
            git push
          else
            echo "No hay cambios nuevos."
          fi
```
