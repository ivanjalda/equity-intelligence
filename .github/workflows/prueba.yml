name: Prueba de acierto (valores del pasado frente al precio real)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 1 * *"      # el día 1 de cada mes

permissions:
  contents: write

concurrency:
  group: equity-data
  cancel-in-progress: false

jobs:
  prueba:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Recalcular el pasado y comparar con el precio real
        env:
          SEC_USER_AGENT: "EquityIntelligence community16jalda@gmail.com"
        run: python -u scripts/backtest.py
      - name: Guardar resultados
        run: |
          git config user.name "equity-bot"
          git config user.email "equity-bot@users.noreply.github.com"
          git add data/prueba.json
          git diff --cached --quiet || (git commit -m "Prueba de acierto $(date -u +%F)" && git pull --rebase origin main && git push)
