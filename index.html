<script>
    let datosMercadoGlobal = {};

    // Diccionario de equivalencias para buscar por nombre o ticker
    const diccionarioActivos = {
      "APPLE": "AAPL", "MICROSOFT": "MSFT", "GOOGL": "GOOGL", "GOOGLE": "GOOGL",
      "AMAZON": "AMZN", "NVIDIA": "NVDA", "META": "META", "TESLA": "TSLA",
      "NIKE": "NKE", "COCA COLA": "KO", "PEPSI": "PEP", "WALMART": "WMT",
      "ORO": "GLD", "PLATA": "SLV", "PETROLEO": "USO", "SP500": "SPY", "NASDAQ": "QQQ"
    };

    async function cargarDatosMercado() {
      try {
        const response = await fetch('data/market-data.json');
        if (!response.ok) throw new Error(`Error HTTP: ${response.status}`);
        datosMercadoGlobal = await response.json();
        console.log('Datos de mercado cargados correctamente:', datosMercadoGlobal);
      } catch (error) {
        console.error('No se pudieron cargar los datos de mercado:', error);
      }
    }

    document.addEventListener('DOMContentLoaded', cargarDatosMercado);

    const form = document.getElementById("searchForm");
    const input = document.getElementById("ticker");
    const result = document.getElementById("result");

    form.addEventListener("submit", function(event) {
      event.preventDefault();
      let consulta = input.value.trim().toUpperCase();

      if (!consulta) return;

      // Si el usuario escribió el nombre completo, lo traducimos al ticker
      if (diccionarioActivos[consulta]) {
        consulta = diccionarioActivos[consulta];
      }

      result.style.display = "block";

      if (datosMercadoGlobal && datosMercadoGlobal[consulta]) {
        const data = datosMercadoGlobal[consulta];
        
        result.innerHTML = `
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
            <strong style="font-size: 1.1em;">${consulta} — Análisis de Mercado</strong>
            <span style="font-size: 0.8em; opacity: 0.7;">Cierre oficial (EOD)</span>
          </div>
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px;">
            <div><strong>Cierre previo:</strong> $${data.c}</div>
            <div><strong>Apertura:</strong> $${data.o}</div>
            <div><strong>Máximo sesión:</strong> $${data.h}</div>
            <div><strong>Mínimo sesión:</strong> $${data.l}</div>
          </div>
          <div style="font-size: 0.9em; margin-bottom: 6px;"><strong>Volumen operado:</strong> ${data.v.toLocaleString()}</div>
          <div style="color: #22c55e; font-size: 0.85em;">✔ Cotización oficial verificada vía Polygon.io</div>
        `;
      } else {
        result.innerHTML = `
          <strong>Activo solicitado: ${input.value}</strong><br>
          No se encuentran datos recientes para este activo en el archivo actual. Ampliaremos el catálogo global de mercados internacionales.
        `;
      }
    });
  </script>
