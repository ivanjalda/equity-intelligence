name: Bonos, índices y materias primas (solo)

on:
  workflow_dispatch:            # solo se ejecuta a mano: sirve para probar rápido

permissions:
  contents: write

concurrency:
  group: equity-data
  cancel-in-progress: false

jobs:
  macro:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Valorar bonos, índices y materias primas
        env:
          SEC_USER_AGENT: "EquityIntelligence community16jalda@gmail.com"
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/macro.py
      - name: Guardar resultados
        run: |
          git config user.name "equity-bot"
          git config user.email "equity-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "Bonos e índices $(date -u +%F)" && git pull --rebase origin main && git push)
