<style>
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--t);font:14px/1.5 -apple-system,Roboto,"Segoe UI",sans-serif;display:flex;flex-direction:column;height:100vh}
header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px;padding:10px 20px;background:var(--p);border-bottom:1px solid var(--b)}
.brand{color:var(--gold);font-weight:800;letter-spacing:1px}
.brand small{display:block;color:var(--m);font-weight:400;letter-spacing:0;font-size:11px}
.btn{background:var(--bg);border:1px solid var(--b);color:var(--m);padding:5px 11px;border-radius:5px;cursor:pointer;font-size:12px}
.btn.on{background:var(--gold);color:#000;border-color:var(--gold);font-weight:700}
.layout{display:grid;grid-template-columns:310px 1fr 320px;grid-template-rows:minmax(0,1fr);flex:1;min-height:0}
#vHist,#vFund{flex:1;min-height:0}
a.btn{text-decoration:none;display:inline-block}
footer{flex:none;border-top:1px solid var(--b);background:var(--p);padding:7px 14px;font-size:12px;color:var(--m);text-align:center}
footer a{color:var(--t);margin:0 6px;white-space:nowrap}
aside,main{overflow-y:auto;padding:14px}
aside{background:var(--p)}
.l{border-right:1px solid var(--b)}.r{border-left:1px solid var(--b)}
input{width:100%;padding:9px 11px;background:var(--bg);border:1px solid var(--b);border-radius:6px;color:var(--w);margin-bottom:10px}
.row{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px}
.card{background:var(--p2);border:1px solid var(--b);border-radius:6px;padding:9px 11px;margin-bottom:7px;cursor:pointer}
.card:hover{border-color:var(--gold)}
.flex{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sm{font-size:12px;color:var(--m)}
.badge{font-size:11px;padding:2px 8px;border-radius:4px;font-weight:700;color:#fff;white-space:nowrap}
.COMPRAR{background:var(--g)}.ESPERAR{background:var(--y);color:#000}.CARO{background:var(--r)}.REVISAR{background:#7e57c2}.NA{background:var(--b);color:var(--m)}
.box{background:var(--p);border:1px solid var(--b);border-radius:8px;padding:18px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:14px 0}
.m{background:var(--p2);border:1px solid var(--b);border-radius:6px;padding:10px;text-align:center}
.m small{display:block;color:var(--m);font-size:12px}.m strong{font-size:18px;color:var(--w)}
h2,h3{margin:0 0 8px;color:var(--gold)}h3{font-size:14px}
.chart{height:380px;margin:8px 0}
table{width:100%;border-collapse:collapse;font-size:12px}
td,th{padding:6px 7px;border-bottom:1px solid var(--b);text-align:left}th{color:var(--m);font-weight:400}
.up{color:var(--g)}.dn{color:var(--r)}
.note{background:var(--p2);border-left:3px solid var(--gold);padding:10px 12px;border-radius:4px;margin:12px 0}
@media(max-width:1100px){.layout{grid-template-columns:270px 1fr}.r{display:none}}
@media(max-width:700px){body{display:block;height:auto}.layout{grid-template-columns:1fr;grid-template-rows:none;height:auto}.l{border-right:0}#vHist,#vFund{overflow:visible}}
.tick{flex:none;position:relative;overflow:hidden;white-space:nowrap;background:var(--p2);border-bottom:1px solid var(--b);height:30px;font-size:12px;line-height:30px}
.tick .lb{position:absolute;left:0;top:0;z-index:2;background:var(--gold);color:#000;font-weight:700;padding:0 12px;box-shadow:6px 0 8px -4px rgba(0,0,0,.35)}
.tick .trk{display:inline-flex;padding-left:130px;animation:tk var(--dur,90s) linear infinite}
.tick:hover .trk{animation-play-state:paused}
.tick .ti{padding:0 18px;border-right:1px solid var(--b)}
.tick .ti b{color:var(--w)}.tick .ti i{color:var(--m);font-style:normal;font-size:11px}
@keyframes tk{to{transform:translateX(-50%)}}
@media(prefers-reduced-motion:reduce){.tick{overflow-x:auto}.tick .trk{animation:none}}
.home{grid-template-columns:300px 1fr 320px}
.ck{background:var(--p2);border:1px solid var(--b);border-radius:8px;padding:10px 12px}
.ck .hr{font-size:26px;font-weight:700;color:var(--w);font-variant-numeric:tabular-nums;line-height:1.2}
.ck .hr small{font-size:14px;color:var(--m);font-weight:400}
.ck .dot{width:10px;height:10px;border-radius:50%;background:var(--r);display:inline-block}
.ck.op .dot{background:var(--g);box-shadow:0 0 0 3px rgba(8,153,129,.25)}
.clocks{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.nw{display:block;color:var(--t);text-decoration:none;padding:8px 0;border-bottom:1px solid var(--b);font-size:13px;line-height:1.35}
.nw:hover{color:var(--gold)}
.nw small{display:block;color:var(--m);font-size:11px;margin-top:2px}
.fila{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--b);cursor:pointer}
.fila:hover strong{color:var(--gold)}
.sc{display:block;background:var(--p2);border:1px solid var(--b);border-radius:8px;padding:12px;color:var(--t);text-decoration:none;cursor:pointer}
.sc:hover{border-color:var(--gold)}
.sc strong{display:block;color:var(--w);margin-bottom:2px}
.secs{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.promo{border:1px dashed var(--b);border-radius:8px;padding:12px;background:var(--p);color:var(--t);text-decoration:none;display:block}
.promo:hover{border-color:var(--gold)}
.promo small{color:var(--m);font-size:11px;text-transform:uppercase;letter-spacing:.5px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:1100px){#vHome{display:flex!important;flex-direction:column;overflow-y:auto}#hC{order:-1}#vHome aside,#vHome main{overflow:visible}#vHome .r{display:block;border-left:0;border-top:1px solid var(--b)}#vHome .l{border-right:0;border-top:1px solid var(--b)}}
@media(max-width:700px){.ck .hr{font-size:22px}.ck{padding:8px 10px}#vHome{overflow:visible}.two{grid-template-columns:1fr}.tick .lb{padding:0 8px}}

.subnav{flex:none;display:flex;flex-wrap:wrap;gap:4px;align-items:center;padding:6px 20px 0;background:var(--p);border-bottom:1px solid var(--b)}
.subnav .tab{background:none;border:0;border-bottom:3px solid transparent;color:var(--m);padding:7px 12px;cursor:pointer;font-size:13px;font-weight:600}
.subnav .tab span{font-weight:400;font-size:11px;background:var(--p2);border-radius:9px;padding:1px 6px;margin-left:3px}
.subnav .tab.on{color:var(--gold);border-bottom-color:var(--gold)}
.subnav .sn{margin-left:auto;padding-right:4px}
.hero{padding:6px 2px 18px}
.hero h1{margin:0 0 8px;font-size:30px;line-height:1.2;color:var(--w)}
.hero h1 span{color:var(--gold)}
.hero p{margin:0 0 12px;max-width:760px;color:var(--t);font-size:15px}
.ad{position:relative;border:1px solid var(--gold);border-radius:10px;padding:16px 14px 12px;margin:12px 0;background:var(--p2)}
.ad .adl{position:absolute;top:-9px;left:12px;background:var(--bg);padding:0 7px;font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--m)}
.ad small{display:block;color:var(--gold);text-transform:uppercase;letter-spacing:.6px;font-size:10.5px;font-weight:700;margin-bottom:3px}
.ad strong{display:block;color:var(--w);font-size:16px;line-height:1.25;margin-bottom:4px}
.ad p{margin:0 0 8px}
@media(max-width:700px){.hero h1{font-size:24px}.subnav{padding:6px 10px 0}.subnav .sn{display:none}}
</style>

<script>
const D={m:{},v:{items:{}},s:[],f:null,h:{}};
let cat="TODOS",hor="TODOS",ver="COMPRAR",cic=false;
const VERS=["COMPRAR","REVISAR","ESPERAR","CARO","TODAS"];
const VT={COMPRAR:"Oportunidades de compra",REVISAR:"Baratas, pero con datos por revisar",ESPERAR:"Mejor esperar",CARO:"Caras ahora",TODAS:"Todos los activos"};
const CATS=["TODOS","ACCIONES","ETFS","COMMODITIES","BONOS"];
const HORS=["TODOS","corto","medio","largo"];
const LBL={COMPRAR:"Comprar",REVISAR:"Revisar",ESPERAR:"Esperar",CARO:"Caro",TODAS:"Todas",TODOS:"Todo",ACCIONES:"Acciones",ETFS:"Índices / ETFs",COMMODITIES:"Materias primas",BONOS:"Bonos",corto:"Corto plazo",medio:"Medio plazo",largo:"Largo plazo"};
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const j=async u=>{try{const r=await fetch(u,{cache:"no-store"});return r.ok?await r.json():null}catch(e){return null}};
const num=(x,d=2)=>typeof x==="number"?x.toLocaleString("es-ES",{minimumFractionDigits:d,maximumFractionDigits:d}):"—";

async function init(){
  D.m=await j("data/market-data.json")||{};
  D.v=await j("data/valuations.json")||{items:{}};
  D.s=await j("data/signals.json")||[];
  D.f=await j("data/13f.json");D.n=await j("data/news.json");
  document.getElementById("upd").textContent=D.v.updated?"Precios al cierre de mercado (no en directo) · actualizado "+D.v.updated:"Sin datos cargados todavía";
  buildFilters();
  document.getElementById("q").oninput=()=>lista();
  lista();panel13f();
  window._best=tickers().map(t=>[t,calc(t)]).filter(x=>x[1]&&x[1].verdict==="COMPRAR").sort((a,b)=>rkOf(b[1])-rkOf(a[1]))[0];
  homeRender();cinta();vista("home");
}
function mk(id,arr,get,set){const e=document.getElementById(id);e.innerHTML="";arr.forEach(k=>{const b=document.createElement("button");b.className="btn"+(get()===k?" on":"");b.textContent=LBL[k];b.onclick=()=>{set(k);buildFilters();lista();navOn()};e.appendChild(b)})}
function buildFilters(){mk("fVer",VERS,()=>ver,k=>ver=k);mk("fHor",HORS,()=>hor,k=>hor=k)}
function toggleCic(){cic=!cic;document.getElementById("fCic").classList.toggle("on",cic);lista()}

function calc(t){
  const v=D.v.items?.[t],p=D.m[t]?.c;
  if(v&&v.assess&&p)return{verdict:v.assess.verdict,mg:null,iv:null,n:0,p,v,assess:v.assess,spr:1,weak:false,odd:false};
  if(!v||!p)return null;
  const ms=[v.dcf,v.graham,v.multiples,v.pb,v.gnum].filter(x=>typeof x==="number"&&x>0);
  if(!ms.length)return null;
  const iv=ms.reduce((a,b)=>a+b,0)/ms.length,mg=(iv-p)/iv*100;
  const weak=mg>=25&&v.health==="Frágil",odd=false;
  const verdict=mg>=25&&!weak?(v.fiab==="baja"?"REVISAR":"COMPRAR"):mg>=0?"ESPERAR":"CARO";
  const spr=Math.max(...ms)/Math.min(...ms),pe=v.eps>0?p/v.eps:null;
  return{iv,mg,verdict,entry:iv*0.75,n:ms.length,p,v,weak,odd,spr,pe};
}
const rkOf=c=>!c?-999:c.assess?c.assess.rank:Math.min(c.mg,50)*(c.v.health==="Sólida"?1:.75)*(c.spr<1.5?1:c.spr<2.2?.85:.65)*(c.v.cyclical?.85:1)*({alta:1,media:.85,baja:.5}[c.v.fiab]??1);
function tickers(){return [...new Set([...Object.keys(D.m),...Object.keys(D.v.items||{})])].filter(t=>!t.startsWith("_"))}
let LIM=40;
function lista(keep){
  if(!keep)LIM=40;
  const q=document.getElementById("q").value.toUpperCase().trim(),el=document.getElementById("list");
  const useVer=!q;
  const rows=[];
  tickers().forEach(t=>{
    const v=D.v.items?.[t]||{},type=v.type||D.m[t]?.type||"ACCIONES";
    if(cat!=="TODOS"&&type!==cat)return;
    if(hor!=="TODOS"&&v.horizon!==hor)return;
    if(cic&&!v.cyclical)return;
    if(q&&!t.includes(q)&&!(v.name||"").toUpperCase().includes(q))return;
    const c=calc(t);
    if(useVer&&ver!=="TODAS"&&(!c||c.verdict!==ver))return;
    rows.push({t,v,c});
  });
  const rk=r=>rkOf(r.c);
  rows.sort((a,b)=>q?(b.t.startsWith(q)-a.t.startsWith(q)||a.t.localeCompare(b.t)):(rk(b)-rk(a)||a.t.localeCompare(b.t)));
  el.innerHTML=`<div class="sm" style="margin-bottom:6px">${q?"Resultados de la búsqueda ("+rows.length+")":useVer?VT[ver]+" ("+rows.length+")":LBL[cat]+" ("+rows.length+")"}</div>`;
  rows.slice(0,LIM).forEach(({t,v,c})=>{
    const d=document.createElement("div");d.className="card";
    d.innerHTML=`<div class="flex"><strong>${esc(t)}</strong><span>${D.m[t]?"$"+num(D.m[t].c):"—"}</span></div>
    <div class="flex sm"><span>${esc(v.name||"")}${v.kind==="banco"?" · banco/seguros":v.cyclical?" · cíclica":""}${v.health?" · salud "+esc(v.health.toLowerCase()):""}</span><span class="badge ${c?c.verdict:"NA"}">${c?c.verdict:"Sin valorar"}</span></div>`;
    d.onclick=()=>detalle(t);el.appendChild(d);
  });
  if(rows.length>LIM){const b=document.createElement("button");b.className="btn";b.style.width="100%";b.textContent=`Mostrar más (${rows.length-LIM} restantes)`;b.onclick=()=>{LIM+=40;lista(true)};el.appendChild(b)}
  if(!rows.length)el.innerHTML+=q?'<p class="sm">Ningún activo coincide con la búsqueda.</p>':'<p class="sm">No hay activos con este veredicto y estos filtros. Prueba otro veredicto, pulsa «Todas» o usa el buscador.</p>';
}
function inicio(){
  const idx=["SPY","QQQ","DIA","IWM"].filter(t=>D.m[t]);
  document.getElementById("main").innerHTML=`<div class="box"><h2>¿Dónde invertir?</h2>
  <p class="sm">Elige un activo. Verás su valor intrínseco calculado con tres métodos, el margen de seguridad y a qué precio conviene entrar.</p>
  ${idx.length?`<div class="grid">${idx.map(t=>`<div class="m"><small>${t}</small><strong>$${num(D.m[t].c)}</strong></div>`).join("")}</div>`:'<div class="note">Todavía no hay precios. Comprueba que existe <code>data/market-data.json</code> y que el workflow se ejecutó sin errores.</div>'}
  <h3>Cómo leer el veredicto</h3>
  <table><tr><td><span class="badge COMPRAR">COMPRAR</span></td><td>Cotiza al menos un 25 % por debajo de su valor intrínseco.</td></tr>
  <tr><td><span class="badge ESPERAR">ESPERAR</span></td><td>Está cerca de su valor justo. Te decimos el precio de entrada y cuándo revisarlo.</td></tr>
  <tr><td><span class="badge CARO">CARO</span></td><td>Cotiza por encima de su valor intrínseco.</td></tr></table></div>`;
}

let cur=null;
window.addEventListener("tema",()=>{if(cur&&document.getElementById("vTerm").style.display!=="none")detalle(cur)});
/* ===== INICIO: cinta de mercado, relojes de bolsas, resumen, noticias ===== */
const NYSE_HOL=["2026-01-01","2026-01-19","2026-02-16","2026-04-03","2026-05-25","2026-06-19","2026-07-03","2026-09-07","2026-11-26","2026-12-25","2027-01-01","2027-01-18","2027-02-15","2027-03-26","2027-05-31","2027-06-18","2027-07-05","2027-09-06","2027-11-25","2027-12-24"];
const NYSE_EARLY={"2026-11-27":780,"2026-12-24":780,"2027-11-26":780};
const BOLSAS=[
  {n:"Nueva York",f:"NYSE / Nasdaq",tz:"America/New_York",o:[[570,960]],hol:NYSE_HOL,early:NYSE_EARLY},
  {n:"Madrid",f:"BME",tz:"Europe/Madrid",o:[[540,1050]]},
  {n:"Londres",f:"LSE",tz:"Europe/London",o:[[480,990]]},
  {n:"Tokio",f:"TSE",tz:"Asia/Tokyo",o:[[540,690],[750,930]]}
];
const DIAS=["el domingo","el lunes","el martes","el miércoles","el jueves","el viernes","el sábado"];
const p2=n=>String(n).padStart(2,"0");
function lp(tz,d){const o={};new Intl.DateTimeFormat("en-CA",{timeZone:tz,hourCycle:"h23",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",second:"2-digit",weekday:"short"}).formatToParts(d).forEach(p=>o[p.type]=p.value);return{date:`${o.year}-${o.month}-${o.day}`,h:+o.hour,mi:+o.minute,s:+o.second,wd:["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].indexOf(o.weekday)}}
const dur=m=>{const h=Math.floor(m/60),r=m%60;return h?`${h} h ${r} min`:`${r} min`};
const hm=m=>`${Math.floor(m/60)}:${p2(m%60)}`;
function habil(b,t){return !(t.wd===0||t.wd===6||(b.hol&&b.hol.includes(t.date)))}
function estado(b,d){
  const t=lp(b.tz,d),m=t.h*60+t.mi;
  if(habil(b,t)){
    const ses=b.o.map(x=>[x[0],(b.early&&b.early[t.date])||x[1]]);
    for(let i=0;i<ses.length;i++){
      const a=ses[i][0],z=ses[i][1];
      if(m>=a&&m<z)return{open:true,txt:"cierra en "+dur(z-m)};
      if(m<a)return{open:false,txt:(i?"reabre":"abre")+" en "+dur(a-m)};
    }
  }
  for(let k=1;k<=10;k++){
    const t2=lp(b.tz,new Date(d.getTime()+k*864e5));
    if(habil(b,t2))return{open:false,txt:"abre "+(k===1?"mañana":DIAS[t2.wd])+" a las "+hm(b.o[0][0])};
  }
  return{open:false,txt:""};
}
function relojes(){
  const el=document.getElementById("clocks");if(!el||!el.offsetParent)return;
  const d=new Date();
  el.innerHTML=BOLSAS.map(b=>{const t=lp(b.tz,d),e=estado(b,d);
    return `<div class="ck ${e.open?"op":"cl"}"><div class="flex"><strong>${esc(b.n)}</strong><span class="dot"></span></div><div class="hr">${p2(t.h)}:${p2(t.mi)}<small>:${p2(t.s)}</small></div><div class="sm"><strong style="color:${e.open?"var(--up)":"var(--dn)"}">${e.open?"Abierta":"Cerrada"}</strong> · ${esc(b.f)}</div><div class="sm">${esc(e.txt)}</div></div>`}).join("");
}
setInterval(relojes,1000);

const TICK=[["SPY","S&P 500"],["QQQ","Nasdaq 100"],["DIA","Dow Jones"],["IWM","Russell 2000"],["GLD","Oro"],["SLV","Plata"],["USO","Petróleo"],["TLT","Bonos EE. UU. largo plazo"],["AAPL",""],["MSFT",""],["NVDA",""],["AMZN",""],["GOOGL",""],["META",""],["TSLA",""]];
async function previo(t){
  const m=D.m[t];if(!m)return null;
  if(typeof m.p==="number")return{p:m.p,d:m.d||null};
  if(D.h[t]===undefined)D.h[t]=await j(`data/history/${t}.json`);
  const h=D.h[t];if(!h||h.length<2)return null;

function precioEn(h,f){
  if(!h||!h.length)return null;let lo=0,hi=h.length-1,r=null;
  while(lo<=hi){const m=(lo+hi)>>1;if(h[m][0]<=f){r=h[m];lo=m+1}else hi=m-1}
  return r&&(new Date(f)-new Date(r[0]))/864e5<=10?r[1]:null;
}

    h+=`<div class="note"><strong>${c.verdict==="COMPRAR"?"Zona de compra.":c.verdict==="REVISAR"?"Datos por revisar.":c.verdict==="ESPERAR"?"Mejor esperar.":"Caro ahora."}</strong> `;

    else if(c.verdict==="REVISAR")h+=`Según las cuentas cotiza un ${num(c.mg,0)} % por debajo de su valor, pero hemos detectado datos dudosos (más abajo) y no la damos como oportunidad hasta resolverlos.`;
    else h+=`${c.weak?"Parece barata en números, pero su salud financiera es frágil. ":""}${c.odd?"La diferencia con su valor es tan grande que puede deberse a un dato atípico: verifícalo antes de actuar. ":""}Precio de entrada recomendado: <strong>$${num(c.entry)}</strong> (25 % bajo el valor intrínseco).${v.review?` Próxima revisión: <strong>${esc(v.review)}</strong>${v.review_reason?" ("+esc(v.review_reason)+")":""}.`:""}`;
    h+=` Valor calculado con ${c.n} de 3 métodos. No es asesoramiento financiero.</div>`;
  }
  if(!c&&v.kind==="financiera")h+=`<div class="note">Los bancos y aseguradoras sí se valoran, pero los fondos, las inmobiliarias y otros intermediarios financieros necesitan métodos propios que todavía no incluimos. Por eso no damos veredicto, para no mostrar un número engañoso.</div>`;
  h+=fiabHTML(v);
  h+=`<div id="drop"></div>`;
  h+=`<div class="flex"><h3>Cotización</h3><div class="row" id="rng" style="margin:0"></div></div><div id="chart" class="chart"></div>`;
  if(c)h+=methodsHTML(v);
  if(v.kind!=="banco")h+=`<h3 style="margin-top:18px">Salud de la empresa · últimos 5 años</h3><div id="fund" class="sm">Cargando cuentas…</div>`;
  h+=holders(t);
  if(v.ratios&&Object.keys(v.ratios).length)h+=`<h3 style="margin-top:16px">Ratios</h3><table>${Object.entries(v.ratios).map(([k,x])=>`<tr><td class="sm">${esc(k)}</td><td>${esc(x)}</td></tr>`).join("")}</table>`;
  main.innerHTML=h+"</div>";
  grafico(t);if(v.kind!=="banco")fundamentos(t);
}
const TH=()=>{const s=getComputedStyle(document.documentElement),g=n=>s.getPropertyValue(n).trim();return{bg:g("--bg"),t:g("--t"),b:g("--b"),p2:g("--p2"),gold:g("--gold"),g:g("--g"),up:g("--up"),dn:g("--dn"),light:temaActual()==="light"}};
async function grafico(t){
  const th=TH();
  const el=document.getElementById("chart");
  if(typeof LightweightCharts==="undefined"){el.innerHTML='<p class="sm">No se pudo cargar la librería del gráfico. Recarga la página con Ctrl+F5.</p>';return}
  if(D.h[t]===undefined)D.h[t]=await j(`data/history/${t}.json`);
  const raw=D.h[t];
  if(!raw||!raw.length){el.innerHTML='<p class="sm">Histórico no disponible todavía para este activo.</p>';return}
  const data=raw.map(([d,x])=>({time:d,value:x}));
  const lastT=new Date(data[data.length-1].time),yr=data.filter(x=>new Date(x.time)>=new Date(lastT-365*864e5));
  const drop=(1-data[data.length-1].value/Math.max(...yr.map(x=>x.value)))*100,wd=document.getElementById("drop");
  if(wd&&drop>=35)wd.innerHTML=`<div class="note" style="border-color:var(--y)">⚠ El precio ha caído un ${num(drop,0)} % desde su máximo del último año. A veces el mercado ve algo que las cuentas todavía no reflejan: conviene entender el motivo antes de actuar.</div>`;
  const chart=LightweightCharts.createChart(el,{autoSize:true,layout:{background:{color:th.bg},textColor:th.t},grid:{vertLines:{visible:false},horzLines:{color:th.p2}},rightPriceScale:{borderColor:th.b},timeScale:{borderColor:th.b},crosshair:{mode:0}});
  const up=data[data.length-1].value>=data[0].value,col=up?th.up:th.dn;
  const cv=calc(t);
  const s=chart.addAreaSeries({autoscaleInfoProvider:o=>{const r=o();if(r&&cv&&cv.iv){r.priceRange.maxValue=Math.max(r.priceRange.maxValue,cv.iv*1.03);r.priceRange.minValue=Math.min(r.priceRange.minValue,cv.entry*0.97)}return r},lineColor:col,topColor:up?(th.light?"rgba(11,128,67,.22)":"rgba(129,201,149,.30)"):(th.light?"rgba(197,34,31,.22)":"rgba(242,139,130,.30)"),bottomColor:"rgba(0,0,0,0)",lineWidth:2});
  if(cv&&cv.iv){
    s.createPriceLine({price:cv.iv,color:th.gold,lineWidth:1,lineStyle:2,axisLabelVisible:true,title:"Valor intrínseco"});
    s.createPriceLine({price:cv.entry,color:th.g,lineWidth:1,lineStyle:2,axisLabelVisible:true,title:"Entrada (-25 %)"});
  }
  const R={"1M":30,"6M":182,"YTD":0,"1A":365,"5A":1826,"Máx.":99999};
  const set=k=>{
    const last=new Date(data[data.length-1].time);
    const from=k==="YTD"?new Date(last.getFullYear(),0,1):new Date(last-R[k]*864e5);
    const f=data.filter(x=>new Date(x.time)>=from);
    s.setData(f.length>1?f:data);chart.timeScale().fitContent();
    [...document.getElementById("rng").children].forEach(b=>b.classList.toggle("on",b.textContent===k));
  };
  const rng=document.getElementById("rng");
  Object.keys(R).forEach(k=>{const b=document.createElement("button");b.className="btn";b.textContent=k;b.onclick=()=>set(k);rng.appendChild(b)});
  set("1A");
}

async function fundamentos(t){
  const el=document.getElementById("fund");if(!el)return;
  const f=await j(`data/fundamentals/${t}.json`);
  if(!f){el.innerHTML='<p class="sm">Las cuentas de la empresa no están disponibles para este activo.</p>';return}
  const bad=new Set(["Pasivos totales","Pasivo corriente","Deuda a largo plazo"]);
  const fmt=v=>v==null?"—":Math.abs(v)>=1000?"$"+num(v/1000,1)+" mil M":"$"+num(v,0)+" M";
  const spark=a=>{const v=a.map(x=>x??0),mx=Math.max(...v.map(Math.abs),1);return `<svg width="${v.length*18}" height="30">${v.map((x,i)=>{const hh=Math.max(1.5,26*Math.abs(x)/mx);return `<rect x="${i*18+2}" y="${28-hh}" width="14" height="${hh}" rx="2" fill="${x<0?"#f23645":"#5b6b8c"}"/>`}).join("")}</svg>`};
  const ico={ok:'<span class="up">✔</span>',warn:'<span style="color:var(--y)">⚠</span>',bad:'<span class="dn">✖</span>'};
  const col={"Sólida":"COMPRAR","Aceptable":"ESPERAR","Frágil":"CARO"}[f.health]||"NA";
  const cards=Object.entries(f.series).map(([k,a])=>{
    const nn=a.filter(x=>x!=null),first=nn[0],last=nn[nn.length-1],span=a.length-1-a.findIndex(x=>x!=null);
    const ch=first>0&&last!=null?(last/first-1)*100:null,good=ch==null?null:(bad.has(k)?ch<=0:ch>=0);
    return `<div class="m" style="text-align:left"><small>${esc(k)}</small><strong style="font-size:16px">${fmt(last)}</strong>
    ${ch!==null?`<div class="${good?"up":"dn"}" style="font-size:12px">${ch>=0?"▲":"▼"} ${num(Math.abs(ch),0)} % en ${span} años</div>`:""}
    ${spark(a)}<div class="sm" style="font-size:11px">${esc(f.hints[k]||"")}</div></div>`}).join("");
  el.innerHTML=`<div class="flex" style="margin-bottom:8px"><span>Lectura rápida</span><span class="badge ${col}">Salud: ${esc(f.health)}</span></div>
  ${f.insights.map(i=>`<div style="margin:4px 0">${ico[i.t]} ${esc(i.x)}</div>`).join("")}
  <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(190px,1fr))">${cards}</div>
  <div class="sm">Años: ${f.years.map(esc).join(" · ")}. Cifras anuales oficiales (SEC), en dólares. M = millones.</div>`;
}
function methodsHTML(v){
  const $=x=>x?"$"+num(x):"—";
  if(v.kind==="banco")return `<h3>Dos formas de calcular el valor intrínseco (banco o aseguradora)</h3><table>
  <tr><th>Método</th><th>Qué hace</th><th>Valor</th></tr>
  <tr><td>Valor contable justificado</td><td class="sm">Cuánto valen sus recursos propios según lo que rentan (ROE) frente a lo que exige un inversor.</td><td>${$(v.pb)}</td></tr>
  <tr><td>Número de Graham</td><td class="sm">Combina beneficio por acción y valor contable por acción.</td><td>${$(v.gnum)}</td></tr></table>`;
  return `<h3>Tres formas de calcular el valor intrínseco</h3><table>
  <tr><th>Método</th><th>Qué hace</th><th>Valor</th></tr>
  <tr><td>Flujo de caja descontado</td><td class="sm">Estima el dinero libre futuro y lo trae a valor de hoy.</td><td>${$(v.dcf)}</td></tr>
  <tr><td>Fórmula de Graham</td><td class="sm">Beneficio por acción y crecimiento esperado.</td><td>${$(v.graham)}</td></tr>
  <tr><td>Múltiplos históricos</td><td class="sm">PER medio de los últimos años por el beneficio actual.</td><td>${$(v.multiples)}</td></tr></table>`;
}
function fiabHTML(v){
  if(!v.fiab)return"";
  const ic={warn:'<span style="color:var(--y)">⚠</span>',bad:'<span class="dn">✖</span>'};
  const cls={alta:"COMPRAR",media:"ESPERAR",baja:"CARO"}[v.fiab],ok=(v.nchk||0)-(v.checks||[]).length;
  return `<div class="note" style="border-color:var(--b)"><div class="flex"><strong>Fiabilidad de los datos</strong><span class="badge ${cls}">${v.fiab[0].toUpperCase()+v.fiab.slice(1)}</span></div>
  <div class="sm" style="margin:4px 0">${ok} de ${v.nchk} comprobaciones superadas: antigüedad de las cuentas, beneficio frente a acciones, PER y coincidencia entre métodos.</div>
  ${(v.checks||[]).map(i=>`<div style="margin:3px 0">${ic[i.t]||""} ${esc(i.x)}</div>`).join("")}</div>`;
}
function detalleAssess(t,c){
  const A=c.assess,v=c.v,ic={ok:'<span class="up">✔</span>',warn:'<span style="color:var(--y)">⚠</span>',bad:'<span class="dn">✖</span>'};
  document.getElementById("main").innerHTML=`<div class="box"><div class="flex"><div><h2>${esc(t)} <span class="sm">${esc(v.name||"")}</span></h2><div class="sm">${esc(A.method)}</div></div><span class="badge ${A.verdict}" style="font-size:13px;padding:5px 12px">${A.verdict}</span></div>
  <div class="grid"><div class="m"><small>Precio</small><strong>$${num(c.p)}</strong></div>${A.metrics.slice(0,3).map(m=>`<div class="m"><small>${esc(m.k)}</small><strong>${esc(m.v)}</strong></div>`).join("")}</div>
  <div class="note"><strong>${A.verdict==="COMPRAR"?"Zona de compra.":A.verdict==="ESPERAR"?"Mejor esperar.":"Caro ahora."}</strong> ${esc(A.summary)} No es asesoramiento financiero.</div>
  <div id="drop"></div><div class="flex"><h3>Cotización</h3><div class="row" id="rng" style="margin:0"></div></div><div id="chart" class="chart"></div>
  <h3>Cómo se ha calculado</h3>${A.points.map(i=>`<div style="margin:4px 0">${ic[i.t]} ${esc(i.x)}</div>`).join("")}
  <p class="sm" style="margin-top:12px">${esc(A.source)}</p></div>`;
  grafico(t);
}
function panel13f(){
  const f=D.f,el=document.getElementById("f13");
  if(!f||!f.top||!f.top.length){el.innerHTML='<div class="box"><h3>Grandes fondos (13F)</h3><p class="sm">Todavía no hay datos 13F cargados. Se generan desde la SEC (EDGAR).</p></div>';return}
  const tb=(a,k)=>a&&a.length?`<table><tr><th>Valor</th><th>${k}</th></tr>${a.map(x=>`<tr><td><strong>${esc(x.ticker||"")}</strong> <span class="sm">${esc(x.name||"")}</span></td><td>${esc(x.funds)} de ${esc(f.total)}</td></tr>`).join("")}</table>`:"";
  el.innerHTML=`<div class="box"><h3>Grandes fondos (13F)</h3>
  <p class="sm">Informes del trimestre ${esc(f.quarter)}, presentados hasta el ${esc(f.filed)}. Llegan con hasta 45 días de retraso y solo cubren acciones de EE. UU. Fuente: SEC.</p>
  <h3 style="margin-top:12px">Más presentes en las carteras</h3>${tb(f.top,"Fondos")}
  <h3 style="margin-top:12px">Compras del trimestre</h3>${tb(f.buys,"Fondos")}
  <h3 style="margin-top:12px">Ventas del trimestre</h3>${tb(f.sells,"Fondos")}
  <button class="btn" style="width:100%;margin-top:10px" onclick="vista('fund')">Ver todas las carteras →</button></div>`;
}
function holders(t){
  const f=D.f;if(!f||!f.managers)return"";
  const r=[];f.managers.forEach(m=>{if(m.stale)return;const p=m.positions.find(x=>x.ticker===t);if(p)r.push([m,p])});
  if(!r.length)return"";
  return `<h3 style="margin-top:16px">Grandes fondos que la tienen</h3><table>${r.map(([m,p])=>`<tr><td>${esc(m.name)} <span class="sm">· ${esc(m.who)}</span></td><td>${num(p.pct,1)} % de su cartera</td><td class="sm">${p.action==="nuevo"?"Compra nueva":p.action==="igual"?"Sin cambios":(p.action==="compra"?"Ha comprado más (+":"Ha vendido (−")+num(Math.abs(p.delta||0),0)+" %)"}</td></tr>`).join("")}</table><p class="sm">Informes 13F a ${esc(r[0][0].period)}, con hasta 45 días de retraso.</p>`;
}
function fondos(){
  const f=D.f,el=document.getElementById("vFund");
  if(!f||!f.managers||!f.managers.length){el.innerHTML='<div class="box"><h2>Grandes fondos</h2><p class="sm">Todavía no hay datos de los informes 13F.</p></div>';return}
  const usd=v=>v>=1e9?"$"+num(v/1e9,1)+" mil M":"$"+num(v/1e6,0)+" M";
  const chg=p=>p.action==="nuevo"?'<span class="badge COMPRAR">Nuevo</span>':p.action==="igual"?'<span class="sm">Sin cambios</span>':p.action==="compra"?`<span class="up">▲ ${num(Math.abs(p.delta),0)} %</span>`:`<span class="dn">▼ ${num(Math.abs(p.delta),0)} %</span>`;
  const link=p=>p.ticker&&D.m[p.ticker]?`<a href="#" onclick="vista('term');detalle('${esc(p.ticker)}');return false" style="color:var(--gold)">${esc(p.ticker)}</a>`:`<strong>${esc(p.ticker||"—")}</strong>`;
  el.innerHTML=`<div class="box"><h2>Grandes fondos · informes 13F</h2>
  <p class="sm">Qué tienen en cartera los grandes inversores y qué han comprado o vendido respecto al trimestre anterior. Los informes llegan con hasta 45 días de retraso, solo incluyen acciones de EE. UU. y no muestran ventas en corto. Fuente: SEC.</p>
  ${f.managers.map(m=>`<details style="margin:8px 0;border:1px solid var(--b);border-radius:6px;padding:8px 12px"><summary style="cursor:pointer"><strong>${esc(m.name)}</strong> <span class="sm">· ${esc(m.who)} · cartera ${usd(m.value)} · ${m.count} posiciones · informe a ${esc(m.period)}</span>${m.stale?' <span class="badge ESPERAR">Informe anterior</span>':""}</summary>
  <div style="overflow-x:auto"><table style="margin-top:8px"><tr><th>Valor</th><th>Empresa</th><th>% de la cartera</th><th>Cambio vs. trimestre anterior</th><th>Importe</th></tr>
  ${m.positions.map(p=>`<tr><td>${link(p)}</td><td class="sm">${esc(p.name)}</td><td>${num(p.pct,1)} %</td><td>${chg(p)}</td><td>${usd(p.value)}</td></tr>`).join("")}</table></div>
  ${m.sold&&m.sold.length?`<p class="sm">Posiciones vendidas por completo: ${m.sold.map(s=>esc(s.ticker||s.name)).join(", ")}</p>`:""}</details>`).join("")}</div>`;
}
function vista(v){
  window._vista=v;
  document.getElementById("vHome").style.display=v==="home"?"grid":"none";
  if(v==="term"&&!window._tinit){window._tinit=true;window._best?detalle(window._best[0]):inicio()}
  document.getElementById("vTerm").style.display=v==="term"?"grid":"none";
  document.getElementById("vHist").style.display=v==="hist"?"block":"none";
  document.getElementById("vFund").style.display=v==="fund"?"block":"none";
  navOn(v);
  if(v==="home")relojes();if(v==="hist")historial();if(v==="fund")fondos();window.scrollTo(0,0);
}
function historialViejo(){
  const el=document.getElementById("vHist"),S=D.s||[];
  if(!S.length){el.innerHTML='<div class="box"><h2>Historial de señales</h2><p class="sm">Aún no hay señales registradas. Cada veredicto se guardará con su fecha y precio, y se comparará con el S&amp;P 500. No hay datos simulados del pasado.</p></div>';return}
  const spy=D.m.SPY?.c;
  const rows=S.map(s=>{const p=D.m[s.ticker]?.c;const r=p?(p/s.price-1)*100:null;const b=spy&&s.spy?(spy/s.spy-1)*100:null;return{...s,p,r,b}});
  const ok=rows.filter(x=>x.r!==null),avg=ok.reduce((a,x)=>a+x.r,0)/(ok.length||1);
  const okb=ok.filter(x=>x.b!==null),avgb=okb.reduce((a,x)=>a+x.b,0)/(okb.length||1);
  const c=x=>x===null?"—":`<span class="${x>=0?"up":"dn"}">${num(x,1)} %</span>`;
  el.innerHTML=`<div class="box"><h2>Historial de señales</h2>
  <p class="sm">Cada señal se registró el día que se emitió. Los resultados no se editan.</p>
  <div class="grid"><div class="m"><small>Señales registradas</small><strong>${S.length}</strong></div>
  <div class="m"><small>Con resultado medido</small><strong>${ok.length}</strong><small>de ${S.length}</small></div>
  <div class="m"><small>Rend. medio (de las medidas)</small><strong>${ok.length?num(avg,1)+" %":"—"}</strong></div>
  <div class="m"><small>S&amp;P 500, mismas fechas</small><strong>${okb.length?num(avgb,1)+" %":"—"}</strong></div></div>
  ${ok.length<30?`<div class="note"><strong>Muestra todavía muy pequeña.</strong> Solo ${ok.length} de ${S.length} señales tienen ya un precio actual con el que medirlas, así que estos porcentajes <strong>no demuestran nada</strong> todavía. Los mostramos tal cual, sin retocarlos. Resultados pasados no garantizan resultados futuros.</div>`:""}
  <div style="overflow-x:auto"><table><tr><th>Fecha</th><th>Activo</th><th>Veredicto</th><th>Precio entonces</th><th>Precio hoy</th><th>Rendimiento</th><th>S&amp;P 500</th></tr>
  ${rows.map(x=>`<tr><td>${esc(x.date)}</td><td><strong>${esc(x.ticker)}</strong></td><td><span class="badge ${esc(x.verdict)}">${esc(x.verdict)}</span></td><td>$${num(x.price)}</td><td>${x.p?"$"+num(x.p):"—"}</td><td>${c(x.r)}</td><td>${c(x.b)}</td></tr>`).join("")}</table></div></div>`;
}
