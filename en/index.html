<script>
const D={m:{},v:{items:{}},s:[],f:null,h:{}};
let cat="TODOS",hor="TODOS",ver="COMPRAR",cic=false;
const VERS=["COMPRAR","REVISAR","ESPERAR","CARO","TODAS"];
const VT={COMPRAR:"Oportunidades de compra",REVISAR:"Baratas, pero con datos por revisar",ESPERAR:"Mejor esperar",CARO:"Caras ahora",TODAS:"Todos los activos"};
const CATS=["TODOS","ACCIONES","ETFS","COMMODITIES","BONOS"];
const HORS=["TODOS","corto","medio","largo"];
const LBL={COMPRAR:"Comprar",REVISAR:"Revisar",ESPERAR:"Esperar",CARO:"Caro",TODAS:"Todas",TODOS:"Todo",ACCIONES:"Acciones",ETFS:"Índices / ETFs",COMMODITIES:"Materias primas",BONOS:"Bonos",corto:"Corto plazo",medio:"Medio plazo",largo:"Largo plazo"};
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const j=async u=>{try{const r=await fetch(u,{cache:"no-store"});return r.ok?await r.json():null}catch(e){return null}};
const num=(x,d=2)=>typeof x==="number"?x.toLocaleString("en-US",{minimumFractionDigits:d,maximumFractionDigits:d}):"—";

async function init(){
  D.m=await j("/data/market-data.json")||{};
  D.v=await j("/data/valuations.json")||{items:{}};
  D.s=await j("/data/signals.json")||[];
  D.f=await j("/data/13f.json");D.n=await j("/data/news.json");
  document.getElementById("upd").textContent=D.v.updated?"Precios al cierre de mercado (no en directo) · actualizado "+D.v.updated:"Sin datos cargados todavía";
  buildFilters();
  document.getElementById("q").oninput=()=>lista();
  lista();panel13f();
  window._best=tickers().map(t=>[t,calc(t)]).filter(x=>x[1]&&x[1].verdict==="COMPRAR").sort((a,b)=>rkOf(b[1])-rkOf(a[1]))[0];
  homeRender();cinta();vista("home");
}
function mk(id,arr,get,set){const e=document.getElementById(id);e.innerHTML="";arr.forEach(k=>{const b=document.createElement("button");b.className="btn"+(get()===k?" on":"");b.textContent=LBL[k];b.onclick=()=>{set(k);buildFilters();lista();navOn()};e.appendChild(b)})}
function buildFilters(){mk("fVer",VERS,()=>ver,k=>ver=k);mk("fHor",HORS,()=>hor,k=>hor=k)}
function toggleCic(){cic=!cic;document.getElementById("fCic").classList.toggle("on",cic);lista()}

function calc(t){
  const v=D.v.items?.[t],p=D.m[t]?.c;
  if(v&&v.assess&&p)return{verdict:v.assess.verdict,mg:null,iv:null,n:0,p,v,assess:v.assess,spr:1,weak:false,odd:false};
  if(!v||!p)return null;
  const ms=[v.dcf,v.graham,v.multiples,v.pb,v.gnum].filter(x=>typeof x==="number"&&x>0);
  if(!ms.length)return null;
  const iv=ms.reduce((a,b)=>a+b,0)/ms.length,mg=(iv-p)/iv*100;
  const weak=mg>=25&&v.health==="Frágil",odd=false;
  const verdict=mg>=25&&!weak?(v.fiab==="baja"?"REVISAR":"COMPRAR"):mg>=0?"ESPERAR":"CARO";
  const spr=Math.max(...ms)/Math.min(...ms),pe=v.eps>0?p/v.eps:null;
  return{iv,mg,verdict,entry:iv*0.75,n:ms.length,p,v,weak,odd,spr,pe};
}
const rkOf=c=>!c?-999:c.assess?c.assess.rank:Math.min(c.mg,50)*(c.v.health==="Sólida"?1:.75)*(c.spr<1.5?1:c.spr<2.2?.85:.65)*(c.v.cyclical?.85:1)*({alta:1,media:.85,baja:.5}[c.v.fiab]??1);
function tickers(){return [...new Set([...Object.keys(D.m),...Object.keys(D.v.items||{})])].filter(t=>!t.startsWith("_"))}
let LIM=40;
function lista(keep){
  if(!keep)LIM=40;
  const q=document.getElementById("q").value.toUpperCase().trim(),el=document.getElementById("list");
  const useVer=!q;
  const rows=[];
  tickers().forEach(t=>{
    const v=D.v.items?.[t]||{},type=v.type||D.m[t]?.type||"ACCIONES";
    if(cat!=="TODOS"&&type!==cat)return;
    if(hor!=="TODOS"&&v.horizon!==hor)return;
    if(cic&&!v.cyclical)return;
    if(q&&!t.includes(q)&&!(v.name||"").toUpperCase().includes(q))return;
    const c=calc(t);
    if(useVer&&ver!=="TODAS"&&(!c||c.verdict!==ver))return;
    rows.push({t,v,c});
  });
  const rk=r=>rkOf(r.c);
  rows.sort((a,b)=>q?(b.t.startsWith(q)-a.t.startsWith(q)||a.t.localeCompare(b.t)):(rk(b)-rk(a)||a.t.localeCompare(b.t)));
  el.innerHTML=`<div class="sm" style="margin-bottom:6px">${q?"Resultados de la búsqueda ("+rows.length+")":useVer?VT[ver]+" ("+rows.length+")":LBL[cat]+" ("+rows.length+")"}</div>`;
  rows.slice(0,LIM).forEach(({t,v,c})=>{
    const d=document.createElement("div");d.className="card";
    d.innerHTML=`<div class="flex"><strong>${esc(t)}</strong><span>${D.m[t]?"$"+num(D.m[t].c):"—"}</span></div>
    <div class="flex sm"><span>${esc(v.name||"")}${v.kind==="banco"?" · banco/seguros":v.cyclical?" · cíclica":""}${v.health?" · salud "+esc(v.health.toLowerCase()):""}</span><span class="badge ${c?c.verdict:"NA"}">${c?c.verdict:"Sin valorar"}</span></div>`;
    d.onclick=()=>detalle(t);el.appendChild(d);
  });
  if(rows.length>LIM){const b=document.createElement("button");b.className="btn";b.style.width="100%";b.textContent=`Mostrar más (${rows.length-LIM} restantes)`;b.onclick=()=>{LIM+=40;lista(true)};el.appendChild(b)}
  if(!rows.length)el.innerHTML+=q?'<p class="sm">Ningún activo coincide con la búsqueda.</p>':'<p class="sm">No hay activos con este veredicto y estos filtros. Prueba otro veredicto, pulsa «Todas» o usa el buscador.</p>';
}
function inicio(){
  const idx=["SPY","QQQ","DIA","IWM"].filter(t=>D.m[t]);
  document.getElementById("main").innerHTML=`<div class="box"><h2>¿Dónde invertir?</h2>
  <p class="sm">Elige un activo. Verás su valor intrínseco calculado con tres métodos, el margen de seguridad y a qué precio conviene entrar.</p>
  ${idx.length?`<div class="grid">${idx.map(t=>`<div class="m"><small>${t}</small><strong>$${num(D.m[t].c)}</strong></div>`).join("")}</div>`:'<div class="note">Todavía no hay precios. Comprueba que existe <code>data/market-data.json</code> y que el workflow se ejecutó sin errores.</div>'}
  <h3>Cómo leer el veredicto</h3>
  <table><tr><td><span class="badge COMPRAR">COMPRAR</span></td><td>Cotiza al menos un 25 % por debajo de su valor intrínseco.</td></tr>
  <tr><td><span class="badge ESPERAR">ESPERAR</span></td><td>Está cerca de su valor justo. Te decimos el precio de entrada y cuándo revisarlo.</td></tr>
  <tr><td><span class="badge CARO">CARO</span></td><td>Cotiza por encima de su valor intrínseco.</td></tr></table></div>`;
}

let cur=null;
window.addEventListener("tema",()=>{if(cur&&document.getElementById("vTerm").style.display!=="none")detalle(cur)});
/* ===== INICIO: cinta de mercado, relojes de bolsas, resumen, noticias ===== */
const NYSE_HOL=["2026-01-01","2026-01-19","2026-02-16","2026-04-03","2026-05-25","2026-06-19","2026-07-03","2026-09-07","2026-11-26","2026-12-25","2027-01-01","2027-01-18","2027-02-15","2027-03-26","2027-05-31","2027-06-18","2027-07-05","2027-09-06","2027-11-25","2027-12-24"];
const NYSE_EARLY={"2026-11-27":780,"2026-12-24":780,"2027-11-26":780};
const BOLSAS=[
  {n:"Nueva York",f:"NYSE / Nasdaq",tz:"America/New_York",o:[[570,960]],hol:NYSE_HOL,early:NYSE_EARLY},
  {n:"Madrid",f:"BME",tz:"Europe/Madrid",o:[[540,1050]]},
  {n:"Londres",f:"LSE",tz:"Europe/London",o:[[480,990]]},
  {n:"Tokio",f:"TSE",tz:"Asia/Tokyo",o:[[540,690],[750,930]]}
];
const DIAS=["el domingo","el lunes","el martes","el miércoles","el jueves","el viernes","el sábado"];
const p2=n=>String(n).padStart(2,"0");
function lp(tz,d){const o={};new Intl.DateTimeFormat("en-CA",{timeZone:tz,hourCycle:"h23",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",second:"2-digit",weekday:"short"}).formatToParts(d).forEach(p=>o[p.type]=p.value);return{date:`${o.year}-${o.month}-${o.day}`,h:+o.hour,mi:+o.minute,s:+o.second,wd:["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].indexOf(o.weekday)}}
const dur=m=>{const h=Math.floor(m/60),r=m%60;return h?`${h} h ${r} min`:`${r} min`};
const hm=m=>`${Math.floor(m/60)}:${p2(m%60)}`;
function habil(b,t){return !(t.wd===0||t.wd===6||(b.hol&&b.hol.includes(t.date)))}
function estado(b,d){
  const t=lp(b.tz,d),m=t.h*60+t.mi;
  if(habil(b,t)){
    const ses=b.o.map(x=>[x[0],(b.early&&b.early[t.date])||x[1]]);
    for(let i=0;i<ses.length;i++){
      const a=ses[i][0],z=ses[i][1];
      if(m>=a&&m<z)return{open:true,txt:"cierra en "+dur(z-m)};
      if(m<a)return{open:false,txt:(i?"reabre":"abre")+" en "+dur(a-m)};
    }
  }
  for(let k=1;k<=10;k++){
    const t2=lp(b.tz,new Date(d.getTime()+k*864e5));
    if(habil(b,t2))return{open:false,txt:"abre "+(k===1?"mañana":DIAS[t2.wd])+" a las "+hm(b.o[0][0])};
  }
  return{open:false,txt:""};
}
function relojes(){

}

async function previo(t){
  const m=D.m[t];if(!m)return null;
  if(typeof m.p==="number")return{p:m.p,d:m.d||null};
  if(D.h[t]===undefined)D.h[t]=await j(`/data/history/${t}.json`);
  const h=D.h[t];if(!h||h.length<2)return null;
  const a=h[h.length-1],b=h[h.length-2];
  if(Math.abs(a[1]-m.c)>0.011)return null;
  return{p:b[1],d:a[0]};
}
const fcorta=iso=>iso.slice(5,7)+"/"+iso.slice(8,10);
async function cinta(){
  const el=document.getElementById("tick");
  const rows=await Promise.all(TICK.filter(x=>D.m[x[0]]).map(async x=>({t:x[0],n:x[1],c:D.m[x[0]].c,pv:await previo(x[0])})));
  if(!rows.length){el.style.display="none";return}
  const ds=rows.map(r=>r.pv&&r.pv.d).filter(Boolean).sort(),dt=ds.length?ds[ds.length-1]:null;
  const one=rows.map(r=>{const ch=r.pv?(r.c/r.pv.p-1)*100:null;
    return `<span class="ti"><b>${esc(r.n||r.t)}</b> ${r.n?`<i>${esc(r.t)}</i> `:""}$${num(r.c)} ${ch===null?"":`<span class="${ch>=0?"up":"dn"}">${ch>=0?"▲":"▼"} ${num(Math.abs(ch))} %</span>`}</span>`}).join("");

}

async function histPrecio(t){if(D.h[t]===undefined)D.h[t]=await j(`/data/history/${t}.json`);return D.h[t]}
function precioEn(h,f){
  if(!h||!h.length)return null;let lo=0,hi=h.length-1,r=null;
  while(lo<=hi){const m=(lo+hi)>>1;if(h[m][0]<=f){r=h[m];lo=m+1}else hi=m-1}
  return r&&(new Date(f)-new Date(r[0]))/864e5<=10?r[1]:null;
}

/* Qué descuenta el mercado + sensibilidad (solo si el motor guardó el flujo de caja y el crecimiento) */
function dcfJS(f0,g,r){let v=0,f=f0;for(let y=1;y<=10;y++){f*=1+(y<=5?g:g/2);v+=f/Math.pow(1+r,y)}return v+f*1.025/(r-.025)/Math.pow(1+r,10)}
function gImplicito(f0,p,r0){r0=r0||.1;let lo=-.15,hi=.35;if(dcfJS(f0,lo,r0)>p)return null;if(dcfJS(f0,hi,r0)<p)return null;for(let i=0;i<50;i++){const m=(lo+hi)/2;if(dcfJS(f0,m,r0)<p)lo=m;else hi=m}return(lo+hi)/2}
function sensHTML(v,p){
  if(!v||!v.fcfps||v.g==null||!p)return"";
  const R0=v.r||.1,gi=gImplicito(v.fcfps,p,R0),pc=x=>(x*100).toFixed(1)+" %";
  const gs=[0,v.g,Math.min(v.g+.03,.2)].filter((x,i,a)=>a.indexOf(x)===i).sort((a,b)=>a-b),rs=[R0-.01,R0,R0+.01];
  let h=`<h3 style="margin-top:18px">Qué descuenta el mercado</h3><p class="sm">Solo con el método de flujo de caja descontado: el precio de hoy equivale a que la empresa crezca <strong>${gi==null?"un ritmo fuera de lo razonable":pc(gi)+" al año"}</strong> (años 1 a 5). Nosotros usamos <strong>${pc(v.g)}</strong>, el que ha tenido en los últimos 5 años. `;
  if(gi!=null)h+=gi<v.g?"El mercado espera <strong>menos</strong> crecimiento que el histórico: o está equivocado, o ve riesgos que las cuentas pasadas no muestran.":"El mercado ya cuenta con <strong>más</strong> crecimiento que el histórico.";
  h+=`</p><table><tr><td class="sm">Valor por acción (flujo de caja)</td>${rs.map(r=>`<td class="sm"><b>descuento ${pc(r)}</b></td>`).join("")}</tr>${gs.map(g=>`<tr><td class="sm">crecimiento ${pc(g)}${g===v.g?" (el nuestro)":""}</td>${rs.map(r=>{const x=dcfJS(v.fcfps,g,r);return`<td class="${x>=p?"up":"dn"}">$${num(x)}</td>`}).join("")}</tr>`).join("")}</table><p class="sm">Verde: vale más que el precio actual. Rojo: vale menos. Si el resultado cambia mucho con pequeños cambios de supuestos, desconfía del valor intrínseco.</p>`;
  return h;
}

async function grafico(t){
  const th=TH();
  const el=document.getElementById("chart");
  if(typeof LightweightCharts==="undefined"){el.innerHTML='<p class="sm">No se pudo cargar la librería del gráfico. Recarga la página con Ctrl+F5.</p>';return}
  if(D.h[t]===undefined)D.h[t]=await j(`/data/history/${t}.json`);
  const raw=D.h[t];
  if(!raw||!raw.length){el.innerHTML='<p class="sm">Histórico no disponible todavía para este activo.</p>';return}
  const data=raw.map(([d,x])=>({time:d,value:x}));
  const lastT=new Date(data[data.length-1].time),yr=data.filter(x=>new Date(x.time)>=new Date(lastT-365*864e5));
  const drop=(1-data[data.length-1].value/Math.max(...yr.map(x=>x.value)))*100,wd=document.getElementById("drop");
  if(wd&&drop>=35)wd.innerHTML=`<div class="note" style="border-color:var(--y)">⚠ El precio ha caído un ${num(drop,0)} % desde su máximo del último año. A veces el mercado ve algo que las cuentas todavía no reflejan: conviene entender el motivo antes de actuar.</div>`;
  const chart=LightweightCharts.createChart(el,{autoSize:true,layout:{background:{color:th.bg},textColor:th.t},grid:{vertLines:{visible:false},horzLines:{color:th.p2}},rightPriceScale:{borderColor:th.b},timeScale:{borderColor:th.b},crosshair:{mode:0}});
  const up=data[data.length-1].value>=data[0].value,col=up?th.up:th.dn;
  const cv=calc(t);

  if(cv&&cv.iv){
    s.createPriceLine({price:cv.iv,color:th.gold,lineWidth:1,lineStyle:2,axisLabelVisible:true,title:"Valor intrínseco"});
    s.createPriceLine({price:cv.entry,color:th.g,lineWidth:1,lineStyle:2,axisLabelVisible:true,title:"Entrada (-25 %)"});
  }
  const R={"1M":30,"6M":182,"YTD":0,"1A":365,"5A":1826,"Máx.":99999};
  const set=k=>{
    const last=new Date(data[data.length-1].time);
    const from=k==="YTD"?new Date(last.getFullYear(),0,1):new Date(last-R[k]*864e5);
    const f=data.filter(x=>new Date(x.time)>=from);

  };
  const rng=document.getElementById("rng");
  Object.keys(R).forEach(k=>{const b=document.createElement("button");b.className="btn";b.textContent=k;b.onclick=()=>set(k);rng.appendChild(b)});
  set("1A");
}

function apuestas(f,usd,link,chg){
  const all=[];f.managers.forEach(m=>{if(m.stale)return;const vis=new Set();m.positions.forEach(p=>{const k=p.ticker||p.name;if(vis.has(k))return;vis.add(k);all.push({m,p})})});
  const big=[...all].sort((a,b)=>b.p.pct-a.p.pct).slice(0,15);
  const buy=all.filter(x=>x.p.action==="nuevo"||x.p.action==="compra").sort((a,b)=>b.p.value-a.p.value).slice(0,15);
  const tb=(L,col)=>`<div style="overflow-x:auto"><table><tr><th>Valor</th><th>Gestor</th>${col}<th>Cambio</th></tr>${L.map(({m,p})=>`<tr><td>${link(p)} <span class="sm">${esc(p.name)}</span></td><td class="sm">${esc(m.who)}</td><td>${col.includes("%")?num(p.pct,1)+" %":usd(p.value)}</td><td>${chg(p)}</td></tr>`).join("")}</table></div>`;
  return `<h3 style="margin-top:14px">Mayores apuestas</h3><p class="sm">Las posiciones que pesan más dentro de la cartera de cada gestor: donde más confían.</p>${tb(big,"<th>% de su cartera</th>")}
  <h3 style="margin-top:14px">Mayores compras del trimestre</h3><p class="sm">Compras nuevas o ampliaciones, ordenadas por el tamaño de la posición.</p>${tb(buy,"<th>Tamaño de la posición</th>")}`;
}

/* --- calculadoras --- */
function dcf2(f0,g,r,tg){let v=0,f=f0;for(let y=1;y<=10;y++){f*=1+(y<=5?g:g/2);v+=f/Math.pow(1+r,y)}return v+f*(1+tg)/(r-tg)/Math.pow(1+r,10)}
function toolCalc(){
  const fld=(id,l,val,st="any")=>`<label class="sm" style="display:block;margin:6px 0 2px">${l}</label><input class="in" id="${id}" type="number" step="${st}" value="${val}" style="width:100%" oninput="calcRun()">`;
  const dl2=tickers().sort().map(t=>`<option value="${esc(t)}">${esc(D.v.items?.[t]?.name||"")}</option>`).join("");
  const tk=k=>`<div class="row" style="margin:6px 0 2px"><input class="in" list="dlc2" id="${k}_tk" placeholder="Autocompletar con un símbolo (ej. AAPL)" style="flex:1;min-width:0" onchange="autoCalc('${k}',this.value)"></div><p class="sm" id="${k}_note" style="margin:2px 0 4px"></p>`;
  document.getElementById("tlBody").innerHTML=`<datalist id="dlc2">${dl2}</datalist><p class="sm">Cada calculadora se puede rellenar a mano o autocompletar con una acción o activo del mercado: escribe su símbolo y se cargan sus datos. Después puedes cambiar cualquier número.</p><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px">
  <div class="box"><h3>Flujo de caja descontado</h3><p class="sm">Cuánto vale hoy el dinero que la empresa generará en 10 años.</p>${tk('c')}
   ${fld("c_f","Caja libre por acción hoy ($)",10)}${fld("c_g","Crecimiento anual, años 1-5 (%)",8)}${fld("c_r","Tasa de descuento (%)",10)}${fld("c_t","Crecimiento a largo plazo (%)",2.5)}${fld("c_p","Precio actual ($)",150)}<div id="c_out" style="margin-top:10px"></div></div>
  <div class="box"><h3>Fórmula de Graham</h3><p class="sm">Valor rápido a partir del beneficio y el crecimiento.</p>${tk('g')}
   ${fld("g_e","Beneficio por acción ($)",6)}${fld("g_g","Crecimiento esperado a 7-10 años (%)",6)}${fld("g_y","Rentabilidad de bonos AAA (%)",5)}${fld("g_p","Precio actual ($)",90)}${fld("g_b","Valor contable por acción ($, número de Graham)",30)}<div id="g_out" style="margin-top:10px"></div></div>
  <div class="box"><h3>Dividendos</h3><p class="sm">Cuánto cobrarías al año por tus acciones.</p>${tk('d')}
   ${fld("d_p","Precio de la acción ($)",50)}${fld("d_d","Dividendo anual por acción ($)",2)}${fld("d_n","Número de acciones",100)}${fld("d_g","Crecimiento anual del dividendo (%)",5)}<div id="d_out" style="margin-top:10px"></div></div>
  <div class="box"><h3>Interés compuesto</h3><p class="sm">Cómo crece una inversión con aportaciones.</p>${tk('i')}
   ${fld("i_i","Dinero inicial ($)",5000)}${fld("i_m","Aportación mensual ($)",200)}${fld("i_r","Rentabilidad anual supuesta (%)",7)}${fld("i_y","Años",20)}<div id="i_out" style="margin-top:10px"></div></div></div>
  <p class="sm" style="margin-top:10px">Ejemplos con números inventados: cámbialos por los tuyos. Son cálculos matemáticos, no promesas ni asesoramiento. La rentabilidad real nunca es constante.</p>`;
  calcRun();
}
function calcRun(){
  const n=i=>parseFloat(document.getElementById(i).value)||0,set=(i,h)=>document.getElementById(i).innerHTML=h,u=x=>"$"+num(x);
  const f=n("c_f"),g=n("c_g")/100,r=n("c_r")/100,tg=n("c_t")/100,p=n("c_p");
  if(r>tg&&f>0){const v=dcf2(f,g,r,tg),m=(v-p)/v*100;set("c_out",`<div class="m"><small>Valor por acción</small><strong>${u(v)}</strong></div><p class="sm">Margen de seguridad: <strong class="${m>=0?"up":"dn"}">${num(m,1)} %</strong>${m>=25?" · zona de interés":m>=0?" · barata, pero con poco colchón":" · cara"}</p>`)}else set("c_out",'<p class="sm">La tasa de descuento debe ser mayor que el crecimiento a largo plazo y la caja positiva.</p>');
  const e=n("g_e"),gg=n("g_g"),y=n("g_y"),gp=n("g_p"),bv=n("g_b");
  let h="";if(e>0&&y>0){const v=e*(8.5+2*gg)*4.4/y,m=(v-gp)/v*100;h+=`<div class="m"><small>Valor de Graham</small><strong>${u(v)}</strong></div><p class="sm">Margen: <strong class="${m>=0?"up":"dn"}">${num(m,1)} %</strong></p>`}
  if(e>0&&bv>0){h+=`<p class="sm">Número de Graham (√(22.5 × beneficio × valor contable)): <strong>${u(Math.sqrt(22.5*e*bv))}</strong></p>`}
  set("g_out",h||'<p class="sm">Pon un beneficio positivo.</p>');
  const dp=n("d_p"),dd=n("d_d"),dn=n("d_n"),dg=n("d_g")/100;
  if(dp>0&&dd<=0)set("d_out",'<p class="sm">Escribe el dividendo anual por acción para ver el resultado.</p>');else if(dp>0){let s=dd*dn,t=0;const f5=[];for(let k=1;k<=10;k++){t+=s;if(k===5||k===10)f5.push(`año ${k}: ${u(s)} al año`);s*=1+dg}
   set("d_out",`<div class="m"><small>Rentabilidad por dividendo</small><strong>${num(dd/dp*100,2)} %</strong></div><p class="sm">Cobras ${u(dd*dn)} al año con ${num(dn,0)} acciones (invertido: ${u(dp*dn)}).<br>${f5.join(" · ")}<br>Cobrado en 10 años: ${u(t)}</p>`)}else set("d_out","");
  const i0=n("i_i"),mm=n("i_m"),ir=n("i_r")/100/12,yy=Math.min(n("i_y"),80);let a=i0;for(let k=0;k<yy*12;k++)a=a*(1+ir)+mm;const ap=i0+mm*yy*12;
  set("i_out",`<div class="m"><small>Valor final</small><strong>${u(a)}</strong></div><p class="sm">Aportado: ${u(ap)} · Ganancia: <strong class="${a>=ap?"up":"dn"}">${u(a-ap)}</strong></p>`);
}
/* --- mapa de valor (treemap) --- */
function squarify(it,x,y,w,h){const out=[];let rest=it.slice();
  while(rest.length){const sh=Math.min(w,h);let row=[],s=0,best=Infinity,i=0;
    const worst=(r,sum)=>{const mx=r[0].a,mn=r[r.length-1].a;return Math.max(sh*sh*mx/(sum*sum),sum*sum/(sh*sh*mn))};

    if(!FBU)return `<div class="emst"><p class="sm">Para recibir el resumen diario necesitas una cuenta gratuita: así sabemos a qué correo enviártelo y puedes darte de baja cuando quieras.</p><div class="row" style="gap:8px"><button class="btn on" type="button" onclick="accModal('crear')">Crea tu cuenta gratis</button><button class="btn" type="button" onclick="accModal('entrar')">Ya tengo cuenta · Entrar</button></div></div>`;
    mail=FBU.email||"";
  }
  let sub=fStore("ei_sub");
  if(conCuenta&&sub==="1"){sub=mail;fStore("ei_sub",mail)}
  if(sub&&(!conCuenta||sub===mail||sub==="1"))return `<div class="emst"><p><strong style="color:var(--up,#2ecc71)">✔ Suscrito al resumen diario.</strong> Lo recibirás cada día en <b>${esc(mail||"tu correo")}</b>. Puedes darte de baja desde el enlace que trae cada correo.</p></div>`;
  const pe=fStore("ei_pend");
  if(pe&&(!conCuenta||pe===mail))return `<div class="emst"><p><strong>¡Casi listo!</strong> Te hemos enviado un correo${pe.indexOf("@")>0?" a <b>"+esc(pe)+"</b>":""}. Pulsa el enlace que trae para confirmar tu suscripción. Si no lo ves, mira en la carpeta de spam.</p><div class="row" style="gap:8px"><button class="btn" type="button" onclick="fEmailReset()">Reenviar el correo</button><button class="btn" type="button" onclick="fEmailYa()">Ya lo he confirmado</button></div></div>`;
  return `<form action="${esc(EMAIL_FORM)}" method="post" onsubmit="fEmailSend(this,'${id}');return false">
  <div class="row" style="flex-wrap:wrap;gap:8px"><input class="in" type="email" name="${esc(EMAIL_FIELD)}" required placeholder="tu@correo.com" value="${esc(mail||"")}"${(typeof FB_CFG!=="undefined"&&FB_CFG&&FB_CFG.apiKey&&mail)?" readonly":""} style="flex:1;min-width:220px"><button class="btn on" type="submit">Quiero el resumen diario</button></div><input type="hidden" name="locale" value="en"><input type="hidden" name="html_type" value="simple"><input type="text" name="email_address_check" value="" tabindex="-1" autocomplete="off" style="position:absolute;left:-9999px" aria-hidden="true">
  <label class="sm" style="display:block;margin-top:6px"><input type="checkbox" required> Acepto recibir cada día por correo el resumen del mercado, las noticias y las oportunidades de Equity Intrinsic, junto con promociones de Valmont &amp; Co. y de Nexus Terminal (webs de Community16 LLC), y he leído la <a href="/en/privacy.html" target="_blank" rel="noopener">política de privacidad</a>. Puedo darme de baja cuando quiera.</label></form>`;
}
function fEmail(){
  if(!EMAIL_FORM)return"";
  return `<div class="box" id="fem"><h3>Recibe el resumen diario por correo</h3><p class="sm">Cada día: cómo cierra el mercado, las oportunidades de compra, las noticias y lo que hacen directivos y grandes fondos. Gratis. Incluye promociones de nuestras propias webs (Valmont &amp; Co. y Nexus Terminal) y nunca compartimos tu correo.</p>${fEmailForm("fem")}</div>`;
}
function fEmailTop(n){
  if(!EMAIL_FORM||fStore("ei_hide")||n<3)return"";
  return `<div class="note" id="femt" style="border-color:var(--gold)"><div class="flex"><strong>¿Te está sirviendo? Recibe las alertas por correo</strong><button class="btn" onclick="fStore('ei_hide','1');document.getElementById('femt').remove()">Ahora no</button></div>${fEmailForm("femt")}</div>`;
}

/* --- cuentas de usuario (Firebase): entrar con Google o con correo y contraseña. Dormido si no hay configuración --- */
const FB_CFG={
  apiKey: "AIzaSyCM07Dxxbtyh32cDdwrTnCr09pdfXEDRWs",
  authDomain: "equity-intelligence-f02ac.firebaseapp.com",
  projectId: "equity-intelligence-f02ac",
  storageBucket: "equity-intelligence-f02ac.firebasestorage.app",
  messagingSenderId: "313039081250",
  appId: "1:313039081250:web:260e91249ef20f3ab9df7b"
};
let FBA=null,FBD=null,FBU=undefined;   /* undefined = aún no sabemos si hay sesión; null = sin sesión */
function fbCargar(){
  if(!FB_CFG||!FB_CFG.apiKey)return;
  const V="10.12.2",base="https://www.gstatic.com/firebasejs/"+V+"/";
  const sc=s=>new Promise((ok,ko)=>{const e=document.createElement("script");e.src=base+s;e.onload=ok;e.onerror=ko;document.head.appendChild(e)});
  sc("firebase-app-compat.js").then(()=>Promise.all([sc("firebase-auth-compat.js"),sc("firebase-firestore-compat.js")])).then(()=>{
    firebase.initializeApp(FB_CFG);FBA=firebase.auth();FBD=firebase.firestore();
    FBA.onAuthStateChanged(async u=>{FBU=u;accBtn();if(u)await accAlEntrar(u);accRefresh();if(typeof fHomeRepaint==="function")fHomeRepaint()});
  }).catch(()=>{});
}
function accRefresh(){
  const vis=id=>{const e=document.getElementById(id);return e&&e.style.display!=="none"};
  try{if(vis("vFicha"))ficha();if(vis("vTools"))tools()}catch(e){}
}
function accLocked(tit){
  /* devuelve "" si el apartado está abierto; si no, el aviso para crear la cuenta gratis */
  if(!FB_CFG||!FB_CFG.apiKey||FBU)return"";
  if(FBU===undefined)return `<div class="box"><p class="sm">Comprobando tu cuenta…</p></div>`;
  return `<div class="box" style="border-color:var(--gold)"><h3>🔒 ${esc(tit)}: gratis con tu cuenta</h3>
  <p class="sm">Crea una cuenta gratuita en unos segundos (con Google o con tu correo) y desbloqueas: los estados financieros completos de 10 años, las compras y ventas de directivos, el comparador de empresas, tus favoritas en cualquier dispositivo y el resumen diario por correo.</p>
  <div class="row"><button class="btn on" onclick="accModal('crear')">Crear cuenta gratis o entrar</button></div></div>`;
}
let accOpen=false;
function accBtn(){
  const w=document.getElementById("accWrap");if(!w)return;
  if(!FBU){w.innerHTML='<button class="btn on" id="accBtn" onclick="accModal()">Entrar</button>';accOpen=false;return}
  w.innerHTML='<button class="btn on" id="accBtn" onclick="accToggle(event)">👤 Mi cuenta ▾</button><div id="accPanel" class="accp" style="display:none"></div>';
  accPanel();
}
function accToggle(e){if(e)e.stopPropagation();accOpen=!accOpen;accPanel()}
function accPanel(){
  const p=document.getElementById("accPanel");if(!p||!FBU)return;
  p.style.display=accOpen?"block":"none";if(!accOpen)return;
  const F=fFavs().filter(t=>D&&D.v&&D.v.items&&D.v.items[t]),fo=document.getElementById("accFav");
  const abierto=fo?fo.open:true;
  p.innerHTML=`<div class="sm" style="word-break:break-all">${esc(FBU.email||"Sesión iniciada")}</div>
  <details id="accFav" ${abierto?"open":""}><summary>★ Mis favoritas (${F.length})</summary>${F.length?F.map(t=>`<div class="fv"><a onclick="accOpen=false;accPanel();fichaIr('${esc(t)}')"><b>${esc(t)}</b> <span class="sm">${esc((D.v.items[t].name||"").slice(0,24))}</span></a><button class="btn" title="Quitar" onclick="fFavToggle('${esc(t)}')">✕</button></div>`).join(""):'<p class="sm">Aún no tienes ninguna. En la ficha de una empresa pulsa «☆ Seguir».</p>'}</details>
  <div class="sm" style="margin:8px 0"><b>Canal de Telegram:</b> ${TELEGRAM_URL?`<a href="#" onclick="tgJoin();return false">Unirme al canal</a>`:"muy pronto"}</div>
  ${EMAIL_FORM?`<details><summary>Resumen diario por correo</summary><div id="accEm" style="margin-top:6px">${fEmailForm("accEm",FBU.email)}</div></details>`:""}
  <div class="row" style="margin:10px 0 0"><button class="btn" onclick="accSalir()">Cerrar sesión</button></div>
  <p class="sm" style="margin-top:8px">Para borrar tu cuenta y tus datos, escribe al contacto de la <a href="/en/privacy.html" target="_blank" rel="noopener">política de privacidad</a>.</p>`;
}
function accSalir(){accOpen=false;FBA.signOut()}
document.addEventListener("click",e=>{if(accOpen&&!e.target.closest("#accWrap")){accOpen=false;accPanel()}});
async function accAlEntrar(u){
  /* une los favoritos de este navegador con los de la cuenta */
  try{
    const ref=FBD.collection("users").doc(u.uid),d=await ref.get(),nube=(d.exists&&Array.isArray(d.data().favs))?d.data().favs:[];
    const mix=[...new Set([...fFavs(),...nube])].slice(0,100);
    fStore("ei_fav",JSON.stringify(mix));
    if(mix.length!==nube.length||!d.exists)await ref.set({favs:mix,email:u.email||null,actualizado:new Date().toISOString()},{merge:true});
  }catch(e){}
}
function fAccSync(a){
  if(!FBU||!FBD)return;
  accPanel();
  FBD.collection("users").doc(FBU.uid).set({favs:a,actualizado:new Date().toISOString()},{merge:true}).catch(()=>{});
}
function accMsg(t,ok){const m=document.getElementById("accMsg");if(m){m.textContent=t;m.className="sm "+(ok?"up":"dn")}}
function accErr(e){
  const c=(e&&e.code)||"";
  return {"auth/invalid-email":"El correo no es válido.","auth/user-not-found":"No hay ninguna cuenta con ese correo.","auth/wrong-password":"La contraseña no es correcta.","auth/invalid-credential":"Correo o contraseña incorrectos. Si aún no tienes cuenta, usa la pestaña «Crear cuenta».",
  "auth/email-already-in-use":"Ya existe una cuenta con ese correo. Pulsa la pestaña «Entrar».","auth/weak-password":"La contraseña es muy corta: usa al menos 6 caracteres.","auth/too-many-requests":"Demasiados intentos. Espera unos minutos.",
  "auth/popup-closed-by-user":"Cerraste la ventana de Google.","auth/network-request-failed":"Sin conexión."}[c]||"No se pudo completar. Inténtalo de nuevo.";
}
let accModo="entrar";
function accModal(modo){
  if(modo)accModo=modo;
  let m=document.getElementById("accModal");if(m)m.remove();
  m=document.createElement("div");m.id="accModal";m.style.cssText="position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:9999;display:flex;align-items:center;justify-content:center;padding:16px";
  m.onclick=e=>{if(e.target===m)m.remove()};
  const nuevo=accModo==="crear";
  m.innerHTML=`<div class="box" style="max-width:400px;width:100%;margin:0;max-height:92vh;overflow:auto">
    <div class="acct"><button class="btn ${nuevo?"":"on"}" onclick="accModal('entrar')">Entrar</button><button class="btn ${nuevo?"on":""}" onclick="accModal('crear')">Crear cuenta</button></div>
    <p class="sm">${nuevo?"Gratis. Desbloquea los estados financieros, las compras de directivos y el comparador, y guarda tus favoritas en cualquier dispositivo.":"Entra para ver tus favoritas y todo lo gratuito de tu cuenta."}</p>
    <button class="btn on" style="width:100%;margin:6px 0" onclick="accGoogle()">Continuar con Google</button>
    <p class="sm" style="text-align:center;margin:8px 0">— o con tu correo —</p>
    <input class="in" id="accMail" type="email" placeholder="tu@correo.com" autocomplete="email" style="width:100%;margin:4px 0;padding:9px">
    <input class="in" id="accPass" type="password" placeholder="Contraseña${nuevo?" (mínimo 6 caracteres)":""}" autocomplete="${nuevo?"new-password":"current-password"}" style="width:100%;margin:4px 0;padding:9px" onkeydown="if(event.key==='Enter')accMail(${nuevo})">
    <label class="sm" style="display:block;margin:6px 0"><input type="checkbox" id="accRec" checked> Mantener la sesión iniciada en este dispositivo</label>
    <div class="row" style="margin-top:8px"><button class="btn on" onclick="accMail(${nuevo})">${nuevo?"Crear mi cuenta":"Entrar"}</button>${nuevo?"":'<button class="btn" onclick="accOlvido()">Olvidé mi contraseña</button>'}</div>
    <p id="accMsg" class="sm" style="margin-top:8px"></p>
    <p class="sm" style="margin-top:8px">Al continuar aceptas la <a href="/en/privacy.html" target="_blank" rel="noopener">política de privacidad</a>.</p></div>`;
  document.body.appendChild(m);
}
function accPers(){
  const r=document.getElementById("accRec"),t=(r&&!r.checked)?"SESSION":"LOCAL";
  try{return FBA.setPersistence(firebase.auth.Auth.Persistence[t]).catch(()=>{})}catch(e){return Promise.resolve()}
}
function accGoogle(){
  accPers();FBA.signInWithPopup(new firebase.auth.GoogleAuthProvider()).then(()=>{const m=document.getElementById("accModal");if(m)m.remove()}).catch(e=>accMsg(accErr(e)));
}
function accMail(crear){
  const e=document.getElementById("accMail").value.trim(),p=document.getElementById("accPass").value;
  if(!e||!p){accMsg("Escribe tu correo y tu contraseña.");return}
  accPers().then(()=>crear?FBA.createUserWithEmailAndPassword(e,p):FBA.signInWithEmailAndPassword(e,p)).then(()=>{const m=document.getElementById("accModal");if(m)m.remove()}).catch(x=>accMsg(accErr(x)));
}
function accOlvido(){
  const e=document.getElementById("accMail").value.trim();
  if(!e){accMsg("Escribe tu correo arriba y vuelve a pulsar.");return}
  FBA.sendPasswordResetEmail(e).then(()=>accMsg("Te hemos enviado un correo para cambiar la contraseña.",true)).catch(x=>accMsg(accErr(x)));
}
fbCargar();

/* aviso tras confirmar la suscripción por correo (Brevo redirige aquí con ?suscrito=1) */
(function(){try{
  if(new URLSearchParams(location.search).get("suscrito")!=="1")return;
  try{localStorage.setItem("ei_sub","1");localStorage.removeItem("ei_pend")}catch(e){}
  history.replaceState(null,"",location.pathname);
  document.addEventListener("DOMContentLoaded",function(){
    const d=document.createElement("div");d.id="subOk";
    d.style.cssText="position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:9999;background:var(--bg2,#111);border:1px solid var(--gold,#d4a72c);border-radius:10px;padding:12px 18px;max-width:92vw;box-shadow:0 6px 24px rgba(0,0,0,.4)";
    d.innerHTML='<strong>¡Suscripción confirmada!</strong> A partir de ahora recibirás el resumen diario de Equity Intrinsic. <button class="btn" style="margin-left:10px" onclick="this.parentNode.remove()">Cerrar</button>';
    document.body.appendChild(d);setTimeout(()=>{d.remove()},12000);
  });
}catch(e){}})();
</script>
