name: Actualizar datos de mercado

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *' # Se ejecuta todos los días a medianoche

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Ejecutar script de actualización
        env:
          POLYGON_KEY: ${{ secrets.POLYGON_KEY }}
        run: python scripts/update_market_data.py

      - name: Guardar y subir cambios al repositorio
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.io"
          git add data/market-data.json
          git commit -m "Actualización automática de datos de mercado [skip ci]" || exit 0
          git push
