<style>
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--t);font:14px/1.5 -apple-system,Roboto,"Segoe UI",sans-serif;display:flex;flex-direction:column;height:100vh}
header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px;padding:10px 20px;background:var(--p);border-bottom:1px solid var(--b)}
.brand{color:var(--gold);font-weight:800;letter-spacing:1px}
.brand small{display:block;color:var(--m);font-weight:400;letter-spacing:0;font-size:11px}
.btn{background:var(--bg);border:1px solid var(--b);color:var(--m);padding:5px 11px;border-radius:5px;cursor:pointer;font-size:12px}
.btn.on{background:var(--gold);color:#000;border-color:var(--gold);font-weight:700}
.layout{display:grid;grid-template-columns:310px 1fr 320px;grid-template-rows:minmax(0,1fr);flex:1;min-height:0}
#vHist,#vFund,#vTools,#vFicha{flex:1;min-height:0}
a.btn{text-decoration:none;display:inline-block}
footer{flex:none;border-top:1px solid var(--b);background:var(--p);padding:7px 14px;font-size:12px;color:var(--m);text-align:center}
footer a{color:var(--t);margin:0 6px;white-space:nowrap}
aside,main{overflow-y:auto;padding:14px}
aside{background:var(--p)}
.l{border-right:1px solid var(--b)}.r{border-left:1px solid var(--b)}
input{width:100%;padding:9px 11px;background:var(--bg);border:1px solid var(--b);border-radius:6px;color:var(--w);margin-bottom:10px}
.row{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px}
.card{background:var(--p2);border:1px solid var(--b);border-radius:6px;padding:9px 11px;margin-bottom:7px;cursor:pointer}
.card:hover{border-color:var(--gold)}
.flex{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sm{font-size:12px;color:var(--m)}
.badge{font-size:11px;padding:2px 8px;border-radius:4px;font-weight:700;color:#fff;white-space:nowrap}
.COMPRAR{background:var(--g)}.ESPERAR{background:var(--y);color:#000}.CARO{background:var(--r)}.REVISAR{background:#7e57c2}.NA{background:var(--b);color:var(--m)}
.box{background:var(--p);border:1px solid var(--b);border-radius:8px;padding:18px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:14px 0}
.m{background:var(--p2);border:1px solid var(--b);border-radius:6px;padding:10px;text-align:center}
.m small{display:block;color:var(--m);font-size:12px}.m strong{font-size:18px;color:var(--w)}
h2,h3{margin:0 0 8px;color:var(--gold)}h3{font-size:14px}
.chart{height:380px;margin:8px 0}
table{width:100%;border-collapse:collapse;font-size:12px}
td,th{padding:6px 7px;border-bottom:1px solid var(--b);text-align:left}th{color:var(--m);font-weight:400}
.up{color:var(--g)}.dn{color:var(--r)}
.note{background:var(--p2);border-left:3px solid var(--gold);padding:10px 12px;border-radius:4px;margin:12px 0}
@media(max-width:1100px){.layout{grid-template-columns:270px 1fr}.r{display:none}}
@media(max-width:700px){body{display:block;height:auto}.layout{grid-template-columns:1fr;grid-template-rows:none;height:auto}.l{border-right:0}#vHist,#vFund,#vTools,#vFicha{overflow:visible}}
.tick{flex:none;position:relative;overflow:hidden;white-space:nowrap;background:var(--p2);border-bottom:1px solid var(--b);height:30px;font-size:12px;line-height:30px}
.tick .lb{position:absolute;left:0;top:0;z-index:2;background:var(--gold);color:#000;font-weight:700;padding:0 12px;box-shadow:6px 0 8px -4px rgba(0,0,0,.35)}
.tick .trk{display:inline-flex;padding-left:130px;animation:tk var(--dur,90s) linear infinite}
.tick:hover .trk{animation-play-state:paused}
.tick .ti{padding:0 18px;border-right:1px solid var(--b)}
.tick .ti b{color:var(--w)}.tick .ti i{color:var(--m);font-style:normal;font-size:11px}
@keyframes tk{to{transform:translateX(-50%)}}
@media(prefers-reduced-motion:reduce){.tick{overflow-x:auto}.tick .trk{animation:none}}
.home{grid-template-columns:300px 1fr 320px}
.ck{background:var(--p2);border:1px solid var(--b);border-radius:8px;padding:10px 12px}

.clocks{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.nw{display:block;color:var(--t);text-decoration:none;padding:8px 0;border-bottom:1px solid var(--b);font-size:13px;line-height:1.35}
.nw:hover{color:var(--gold)}

@media(max-width:1100px){#vHome[style*="grid"]{display:flex!important;flex-direction:column;overflow-y:auto}#hC{order:-1}#vHome aside,#vHome main{overflow:visible}#vHome .r{display:block;border-left:0;border-top:1px solid var(--b)}#vHome .l{border-right:0;border-top:1px solid var(--b)}}

.subnav{flex:none;display:flex;flex-wrap:wrap;gap:4px;align-items:center;padding:6px 20px 0;background:var(--p);border-bottom:1px solid var(--b)}
.subnav .tab{background:none;border:0;border-bottom:3px solid transparent;color:var(--m);padding:7px 12px;cursor:pointer;font-size:13px;font-weight:600}
.subnav .tab span{font-weight:400;font-size:11px;background:var(--p2);border-radius:9px;padding:1px 6px;margin-left:3px}

.ad small{display:block;color:var(--gold);text-transform:uppercase;letter-spacing:.6px;font-size:10.5px;font-weight:700;margin-bottom:3px}
.ad strong{display:block;color:var(--w);font-size:16px;line-height:1.25;margin-bottom:4px}
.ad p{margin:0 0 8px}
@media(max-width:700px){.hero h1{font-size:24px}.subnav{padding:6px 10px 0}.subnav .sn{display:none}}

.nwi{padding:0;border:1px solid var(--b);border-radius:8px;overflow:hidden;margin-bottom:10px;background:var(--p2)}
.nwi .ph{display:block;aspect-ratio:16/9;background:var(--p)}
.nwi img{display:block;width:100%;height:100%;object-fit:cover}
.nwi .tx{display:block;padding:8px 10px}

.adimg{display:flex;gap:6px;margin:2px 0 10px}.adimg img{flex:1;min-width:0;width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:5px;border:1px solid var(--b)}.adsvg{display:block;width:100%;height:auto;margin:2px 0 10px}
.in{background:var(--p2);color:var(--t);border:1px solid var(--b);border-radius:6px;padding:8px 10px;font:inherit}
.tmap{border-radius:8px;overflow:hidden;background:var(--b)}.tile{position:absolute;box-sizing:border-box;border:1px solid var(--bg);color:#fff;cursor:pointer;overflow:hidden;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:700;font-size:clamp(9px,1.1vw,15px)}.tile:hover{filter:brightness(1.18)}.tile span{line-height:1.15;text-shadow:0 1px 2px rgba(0,0,0,.45)}.tile small{display:block;font-weight:500;font-size:.8em}
#vTools{flex:1;min-height:0;overflow:auto}

.nwf{border:1px solid var(--b);border-left:4px solid hsl(var(--h) 55% 52%);border-radius:8px;padding:10px 12px;margin:8px 0;background:var(--p2);font-size:15px;line-height:1.3}.nwf em{display:block;font-style:normal;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:hsl(var(--h) 60% 62%);font-weight:700;margin-bottom:4px}.nwf span{display:block;font-weight:600}.nwf small{display:block;margin-top:4px;color:var(--m)}

.nwf .ic{display:flex;align-items:center;justify-content:center;height:60px;margin:-2px 0 8px;border-radius:6px;background:linear-gradient(135deg,hsl(var(--h) 45% 24%),hsl(var(--h) 45% 13%))}.nwf .ic svg{height:44px;width:auto}
.sug{position:absolute;left:0;right:0;top:100%;z-index:30;background:var(--p);border:1px solid var(--b);border-radius:8px;margin-top:2px;box-shadow:0 8px 24px rgba(0,0,0,.25);overflow:hidden}
.sugi{padding:9px 12px;cursor:pointer;border-bottom:1px solid var(--p2)}.sugi:hover{background:var(--p2)}
.fsc.base{border:1px solid var(--gold)}
.pill{font-size:11px;padding:2px 7px;border-radius:10px;background:var(--p2);color:var(--t)}.pill.up{color:var(--up)}.pill.dn{color:var(--dn)}
table.fs{min-width:100%;border-collapse:collapse}table.fs th,table.fs td{text-align:right;padding:6px 10px;white-space:nowrap}
table.fs td.stk,table.fs th:first-child{text-align:left;position:sticky;left:0;background:var(--p);z-index:1}
table.fs tr.calc td{color:var(--g)}
a.gl{color:inherit;text-decoration:none;border-bottom:1px dotted var(--g)}a.gl:hover{color:var(--gold)}
#vFicha{padding:0 0 30px}#vFicha>.box,#vFicha #fbody>.box,#vFicha #fbody>.note{margin-bottom:12px}
</style>

</footer>

<script>
const D={m:{},v:{items:{}},s:[],f:null,h:{}};
let cat="TODOS",hor="TODOS",ver="COMPRAR",cic=false;
const VERS=["COMPRAR","REVISAR","ESPERAR","CARO","TODAS"];
const VT={COMPRAR:"Oportunidades de compra",REVISAR:"Baratas, pero con datos por revisar",ESPERAR:"Mejor esperar",CARO:"Caras ahora",TODAS:"Todos los activos"};
const CATS=["TODOS","ACCIONES","ETFS","COMMODITIES","BONOS"];
const HORS=["TODOS","corto","medio","largo"];
const LBL={COMPRAR:"Comprar",REVISAR:"Revisar",ESPERAR:"Esperar",CARO:"Caro",TODAS:"Todas",TODOS:"Todo",ACCIONES:"Acciones",ETFS:"Índices / ETFs",COMMODITIES:"Materias primas",BONOS:"Bonos",corto:"Corto plazo",medio:"Medio plazo",largo:"Largo plazo"};
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const j=async u=>{try{const r=await fetch(u,{cache:"no-store"});return r.ok?await r.json():null}catch(e){return null}};
const num=(x,d=2)=>typeof x==="number"?x.toLocaleString("es-ES",{minimumFractionDigits:d,maximumFractionDigits:d}):"—";

async function init(){
  D.m=await j("data/market-data.json")||{};
  D.v=await j("data/valuations.json")||{items:{}};
  D.s=await j("data/signals.json")||[];
  D.f=await j("data/13f.json");D.n=await j("data/news.json");
  document.getElementById("upd").textContent=D.v.updated?"Precios al cierre de mercado (no en directo) · actualizado "+D.v.updated:"Sin datos cargados todavía";
  buildFilters();
  document.getElementById("q").oninput=()=>lista();
  lista();panel13f();
  window._best=tickers().map(t=>[t,calc(t)]).filter(x=>x[1]&&x[1].verdict==="COMPRAR").sort((a,b)=>rkOf(b[1])-rkOf(a[1]))[0];
  homeRender();cinta();vista("home");
}
function mk(id,arr,get,set){const e=document.getElementById(id);e.innerHTML="";arr.forEach(k=>{const b=document.createElement("button");b.className="btn"+(get()===k?" on":"");b.textContent=LBL[k];b.onclick=()=>{set(k);buildFilters();lista();navOn()};e.appendChild(b)})}
function buildFilters(){mk("fVer",VERS,()=>ver,k=>ver=k);mk("fHor",HORS,()=>hor,k=>hor=k)}
function toggleCic(){cic=!cic;document.getElementById("fCic").classList.toggle("on",cic);lista()}

function calc(t){
  const v=D.v.items?.[t],p=D.m[t]?.c;
  if(v&&v.assess&&p)return{verdict:v.assess.verdict,mg:null,iv:null,n:0,p,v,assess:v.assess,spr:1,weak:false,odd:false};
  if(!v||!p)return null;
  const ms=[v.dcf,v.graham,v.multiples,v.pb,v.gnum].filter(x=>typeof x==="number"&&x>0);
  if(!ms.length)return null;
  const iv=ms.reduce((a,b)=>a+b,0)/ms.length,mg=(iv-p)/iv*100;
  const weak=mg>=25&&v.health==="Frágil",odd=false;
  const verdict=mg>=25&&!weak?(v.fiab==="baja"?"REVISAR":"COMPRAR"):mg>=0?"ESPERAR":"CARO";
  const spr=Math.max(...ms)/Math.min(...ms),pe=v.eps>0?p/v.eps:null;
  return{iv,mg,verdict,entry:iv*0.75,n:ms.length,p,v,weak,odd,spr,pe};
}
const rkOf=c=>!c?-999:c.assess?c.assess.rank:Math.min(c.mg,50)*(c.v.health==="Sólida"?1:.75)*(c.spr<1.5?1:c.spr<2.2?.85:.65)*(c.v.cyclical?.85:1)*({alta:1,media:.85,baja:.5}[c.v.fiab]??1);
function tickers(){return [...new Set([...Object.keys(D.m),...Object.keys(D.v.items||{})])].filter(t=>!t.startsWith("_"))}
let LIM=40;
function lista(keep){
  if(!keep)LIM=40;
  const q=document.getElementById("q").value.toUpperCase().trim(),el=document.getElementById("list");
  const useVer=!q;
  const rows=[];
  tickers().forEach(t=>{
    const v=D.v.items?.[t]||{},type=v.type||D.m[t]?.type||"ACCIONES";
    if(cat!=="TODOS"&&type!==cat)return;
    if(hor!=="TODOS"&&v.horizon!==hor)return;
    if(cic&&!v.cyclical)return;
    if(q&&!t.includes(q)&&!(v.name||"").toUpperCase().includes(q))return;
    const c=calc(t);
    if(useVer&&ver!=="TODAS"&&(!c||c.verdict!==ver))return;
    rows.push({t,v,c});
  });
  const rk=r=>rkOf(r.c);
  rows.sort((a,b)=>q?(b.t.startsWith(q)-a.t.startsWith(q)||a.t.localeCompare(b.t)):(rk(b)-rk(a)||a.t.localeCompare(b.t)));
  el.innerHTML=`<div class="sm" style="margin-bottom:6px">${q?"Resultados de la búsqueda ("+rows.length+")":useVer?VT[ver]+" ("+rows.length+")":LBL[cat]+" ("+rows.length+")"}</div>`;
  rows.slice(0,LIM).forEach(({t,v,c})=>{
    const d=document.createElement("div");d.className="card";
    d.innerHTML=`<div class="flex"><strong>${esc(t)}</strong><span>${D.m[t]?"$"+num(D.m[t].c):"—"}</span></div>
    <div class="flex sm"><span>${esc(v.name||"")}${v.kind==="banco"?" · banco/seguros":v.cyclical?" · cíclica":""}${v.health?" · salud "+esc(v.health.toLowerCase()):""}</span><span class="badge ${c?c.verdict:"NA"}">${c?c.verdict:"Sin valorar"}</span></div>`;
    d.onclick=()=>detalle(t);el.appendChild(d);
  });
  if(rows.length>LIM){const b=document.createElement("button");b.className="btn";b.style.width="100%";b.textContent=`Mostrar más (${rows.length-LIM} restantes)`;b.onclick=()=>{LIM+=40;lista(true)};el.appendChild(b)}
  if(!rows.length)el.innerHTML+=q?'<p class="sm">Ningún activo coincide con la búsqueda.</p>':'<p class="sm">No hay activos con este veredicto y estos filtros. Prueba otro veredicto, pulsa «Todas» o usa el buscador.</p>';
}
function inicio(){
  const idx=["SPY","QQQ","DIA","IWM"].filter(t=>D.m[t]);
  document.getElementById("main").innerHTML=`<div class="box"><h2>¿Dónde invertir?</h2>
  <p class="sm">Elige un activo. Verás su valor intrínseco calculado con tres métodos, el margen de seguridad y a qué precio conviene entrar.</p>
  ${idx.length?`<div class="grid">${idx.map(t=>`<div class="m"><small>${t}</small><strong>$${num(D.m[t].c)}</strong></div>`).join("")}</div>`:'<div class="note">Todavía no hay precios. Comprueba que existe <code>data/market-data.json</code> y que el workflow se ejecutó sin errores.</div>'}
  <h3>Cómo leer el veredicto</h3>
  <table><tr><td><span class="badge COMPRAR">COMPRAR</span></td><td>Cotiza al menos un 25 % por debajo de su valor intrínseco.</td></tr>
  <tr><td><span class="badge ESPERAR">ESPERAR</span></td><td>Está cerca de su valor justo. Te decimos el precio de entrada y cuándo revisarlo.</td></tr>
  <tr><td><span class="badge CARO">CARO</span></td><td>Cotiza por encima de su valor intrínseco.</td></tr></table></div>`;
}

let cur=null;
window.addEventListener("tema",()=>{if(cur&&document.getElementById("vTerm").style.display!=="none")detalle(cur)});
/* ===== INICIO: cinta de mercado, relojes de bolsas, resumen, noticias ===== */
const NYSE_HOL=["2026-01-01","2026-01-19","2026-02-16","2026-04-03","2026-05-25","2026-06-19","2026-07-03","2026-09-07","2026-11-26","2026-12-25","2027-01-01","2027-01-18","2027-02-15","2027-03-26","2027-05-31","2027-06-18","2027-07-05","2027-09-06","2027-11-25","2027-12-24"];
const NYSE_EARLY={"2026-11-27":780,"2026-12-24":780,"2027-11-26":780};
const BOLSAS=[

const p2=n=>String(n).padStart(2,"0");
function lp(tz,d){const o={};new Intl.DateTimeFormat("en-CA",{timeZone:tz,hourCycle:"h23",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",second:"2-digit",weekday:"short"}).formatToParts(d).forEach(p=>o[p.type]=p.value);return{date:`${o.year}-${o.month}-${o.day}`,h:+o.hour,mi:+o.minute,s:+o.second,wd:["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].indexOf(o.weekday)}}
const dur=m=>{const h=Math.floor(m/60),r=m%60;return h?`${h} h ${r} min`:`${r} min`};
const hm=m=>`${Math.floor(m/60)}:${p2(m%60)}`;
function habil(b,t){return !(t.wd===0||t.wd===6||(b.hol&&b.hol.includes(t.date)))}
function estado(b,d){
  const t=lp(b.tz,d),m=t.h*60+t.mi;
  if(habil(b,t)){
    const ses=b.o.map(x=>[x[0],(b.early&&b.early[t.date])||x[1]]);
    for(let i=0;i<ses.length;i++){
      const a=ses[i][0],z=ses[i][1];
      if(m>=a&&m<z)return{open:true,txt:"cierra en "+dur(z-m)};
      if(m<a)return{open:false,txt:(i?"reabre":"abre")+" en "+dur(a-m)};
    }
  }
  for(let k=1;k<=10;k++){
    const t2=lp(b.tz,new Date(d.getTime()+k*864e5));
    if(habil(b,t2))return{open:false,txt:"abre "+(k===1?"mañana":DIAS[t2.wd])+" a las "+hm(b.o[0][0])};
  }
  return{open:false,txt:""};
}
function relojes(){

}

async function previo(t){
  const m=D.m[t];if(!m)return null;
  if(typeof m.p==="number")return{p:m.p,d:m.d||null};
  if(D.h[t]===undefined)D.h[t]=await j(`data/history/${t}.json`);
  const h=D.h[t];if(!h||h.length<2)return null;
  const a=h[h.length-1],b=h[h.length-2];
  if(Math.abs(a[1]-m.c)>0.011)return null;
  return{p:b[1],d:a[0]};
}

async function cinta(){

}

async function histPrecio(t){if(D.h[t]===undefined)D.h[t]=await j(`data/history/${t}.json`);return D.h[t]}
function precioEn(h,f){
  if(!h||!h.length)return null;let lo=0,hi=h.length-1,r=null;
  while(lo<=hi){const m=(lo+hi)>>1;if(h[m][0]<=f){r=h[m];lo=m+1}else hi=m-1}
  return r&&(new Date(f)-new Date(r[0]))/864e5<=10?r[1]:null;
}

/* Qué descuenta el mercado + sensibilidad (solo si el motor guardó el flujo de caja y el crecimiento) */
function dcfJS(f0,g,r){let v=0,f=f0;for(let y=1;y<=10;y++){f*=1+(y<=5?g:g/2);v+=f/Math.pow(1+r,y)}return v+f*1.025/(r-.025)/Math.pow(1+r,10)}
function gImplicito(f0,p,r0){r0=r0||.1;let lo=-.15,hi=.35;if(dcfJS(f0,lo,r0)>p)return null;if(dcfJS(f0,hi,r0)<p)return null;for(let i=0;i<50;i++){const m=(lo+hi)/2;if(dcfJS(f0,m,r0)<p)lo=m;else hi=m}return(lo+hi)/2}
function sensHTML(v,p){
  if(!v||!v.fcfps||v.g==null||!p)return"";
  const R0=v.r||.1,gi=gImplicito(v.fcfps,p,R0),pc=x=>(x*100).toFixed(1).replace(".",",")+" %";
  const gs=[0,v.g,Math.min(v.g+.03,.2)].filter((x,i,a)=>a.indexOf(x)===i).sort((a,b)=>a-b),rs=[R0-.01,R0,R0+.01];
  let h=`<h3 style="margin-top:18px">Qué descuenta el mercado</h3><p class="sm">Solo con el método de flujo de caja descontado: el precio de hoy equivale a que la empresa crezca <strong>${gi==null?"un ritmo fuera de lo razonable":pc(gi)+" al año"}</strong> (años 1 a 5). Nosotros usamos <strong>${pc(v.g)}</strong>, el que ha tenido en los últimos 5 años. `;
  if(gi!=null)h+=gi<v.g?"El mercado espera <strong>menos</strong> crecimiento que el histórico: o está equivocado, o ve riesgos que las cuentas pasadas no muestran.":"El mercado ya cuenta con <strong>más</strong> crecimiento que el histórico.";
  h+=`</p><table><tr><td class="sm">Valor por acción (flujo de caja)</td>${rs.map(r=>`<td class="sm"><b>descuento ${pc(r)}</b></td>`).join("")}</tr>${gs.map(g=>`<tr><td class="sm">crecimiento ${pc(g)}${g===v.g?" (el nuestro)":""}</td>${rs.map(r=>{const x=dcfJS(v.fcfps,g,r);return`<td class="${x>=p?"up":"dn"}">$${num(x)}</td>`}).join("")}</tr>`).join("")}</table><p class="sm">Verde: vale más que el precio actual. Rojo: vale menos. Si el resultado cambia mucho con pequeños cambios de supuestos, desconfía del valor intrínseco.</p>`;
  return h;
}

const TH=()=>{const s=getComputedStyle(document.documentElement),g=n=>s.getPropertyValue(n).trim();return{bg:g("--bg"),t:g("--t"),b:g("--b"),p2:g("--p2"),gold:g("--gold"),g:g("--g"),up:g("--up"),dn:g("--dn"),light:temaActual()==="light"}};
async function grafico(t){
  const th=TH();
  const el=document.getElementById("chart");
  if(typeof LightweightCharts==="undefined"){el.innerHTML='<p class="sm">No se pudo cargar la librería del gráfico. Recarga la página con Ctrl+F5.</p>';return}
  if(D.h[t]===undefined)D.h[t]=await j(`data/history/${t}.json`);
  const raw=D.h[t];
  if(!raw||!raw.length){el.innerHTML='<p class="sm">Histórico no disponible todavía para este activo.</p>';return}
  const data=raw.map(([d,x])=>({time:d,value:x}));
  const lastT=new Date(data[data.length-1].time),yr=data.filter(x=>new Date(x.time)>=new Date(lastT-365*864e5));
  const drop=(1-data[data.length-1].value/Math.max(...yr.map(x=>x.value)))*100,wd=document.getElementById("drop");
  if(wd&&drop>=35)wd.innerHTML=`<div class="note" style="border-color:var(--y)">⚠ El precio ha caído un ${num(drop,0)} % desde su máximo del último año. A veces el mercado ve algo que las cuentas todavía no reflejan: conviene entender el motivo antes de actuar.</div>`;
  const chart=LightweightCharts.createChart(el,{autoSize:true,layout:{background:{color:th.bg},textColor:th.t},grid:{vertLines:{visible:false},horzLines:{color:th.p2}},rightPriceScale:{borderColor:th.b},timeScale:{borderColor:th.b},crosshair:{mode:0}});
  const up=data[data.length-1].value>=data[0].value,col=up?th.up:th.dn;
  const cv=calc(t);
  const s=chart.addAreaSeries({autoscaleInfoProvider:o=>{const r=o();if(r&&cv&&cv.iv){r.priceRange.maxValue=Math.max(r.priceRange.maxValue,cv.iv*1.03);r.priceRange.minValue=Math.min(r.priceRange.minValue,cv.entry*0.97)}return r},lineColor:col,topColor:up?(th.light?"rgba(11,128,67,.22)":"rgba(129,201,149,.30)"):(th.light?"rgba(197,34,31,.22)":"rgba(242,139,130,.30)"),bottomColor:"rgba(0,0,0,0)",lineWidth:2});
  if(cv&&cv.iv){
    s.createPriceLine({price:cv.iv,color:th.gold,lineWidth:1,lineStyle:2,axisLabelVisible:true,title:"Valor intrínseco"});
    s.createPriceLine({price:cv.entry,color:th.g,lineWidth:1,lineStyle:2,axisLabelVisible:true,title:"Entrada (-25 %)"});
  }
  const R={"1M":30,"6M":182,"YTD":0,"1A":365,"5A":1826,"Máx.":99999};
  const set=k=>{
    const last=new Date(data[data.length-1].time);
    const from=k==="YTD"?new Date(last.getFullYear(),0,1):new Date(last-R[k]*864e5);
    const f=data.filter(x=>new Date(x.time)>=from);
    s.setData(f.length>1?f:data);chart.timeScale().fitContent();
    [...document.getElementById("rng").children].forEach(b=>b.classList.toggle("on",b.textContent===k));
  };
  const rng=document.getElementById("rng");
  Object.keys(R).forEach(k=>{const b=document.createElement("button");b.className="btn";b.textContent=k;b.onclick=()=>set(k);rng.appendChild(b)});
  set("1A");
}

function dcf2(f0,g,r,tg){let v=0,f=f0;for(let y=1;y<=10;y++){f*=1+(y<=5?g:g/2);v+=f/Math.pow(1+r,y)}return v+f*(1+tg)/(r-tg)/Math.pow(1+r,10)}

  <div class="box"><h3>Fórmula de Graham</h3><p class="sm">Valor rápido a partir del beneficio y el crecimiento.</p>${tk('g')}

  <div class="box"><h3>Dividendos</h3><p class="sm">Cuánto cobrarías al año por tus acciones.</p>${tk('d')}
   ${fld("d_p","Precio de la acción ($)",50)}${fld("d_d","Dividendo anual por acción ($)",2)}${fld("d_n","Número de acciones",100)}${fld("d_g","Crecimiento anual del dividendo (%)",5)}<div id="d_out" style="margin-top:10px"></div></div>

function calcRun(){
  const n=i=>parseFloat(document.getElementById(i).value)||0,set=(i,h)=>document.getElementById(i).innerHTML=h,u=x=>"$"+num(x);
  const f=n("c_f"),g=n("c_g")/100,r=n("c_r")/100,tg=n("c_t")/100,p=n("c_p");
  if(r>tg&&f>0){const v=dcf2(f,g,r,tg),m=(v-p)/v*100;set("c_out",`<div class="m"><small>Valor por acción</small><strong>${u(v)}</strong></div><p class="sm">Margen de seguridad: <strong class="${m>=0?"up":"dn"}">${num(m,1)} %</strong>${m>=25?" · zona de interés":m>=0?" · barata, pero con poco colchón":" · cara"}</p>`)}else set("c_out",'<p class="sm">La tasa de descuento debe ser mayor que el crecimiento a largo plazo y la caja positiva.</p>');
  const e=n("g_e"),gg=n("g_g"),y=n("g_y"),gp=n("g_p"),bv=n("g_b");
  let h="";if(e>0&&y>0){const v=e*(8.5+2*gg)*4.4/y,m=(v-gp)/v*100;h+=`<div class="m"><small>Valor de Graham</small><strong>${u(v)}</strong></div><p class="sm">Margen: <strong class="${m>=0?"up":"dn"}">${num(m,1)} %</strong></p>`}
  if(e>0&&bv>0){h+=`<p class="sm">Número de Graham (√(22,5 × beneficio × valor contable)): <strong>${u(Math.sqrt(22.5*e*bv))}</strong></p>`}
  set("g_out",h||'<p class="sm">Pon un beneficio positivo.</p>');
  const dp=n("d_p"),dd=n("d_d"),dn=n("d_n"),dg=n("d_g")/100;
  if(dp>0&&dd<=0)set("d_out",'<p class="sm">Escribe el dividendo anual por acción para ver el resultado.</p>');else if(dp>0){let s=dd*dn,t=0;const f5=[];for(let k=1;k<=10;k++){t+=s;if(k===5||k===10)f5.push(`año ${k}: ${u(s)} al año`);s*=1+dg}
   set("d_out",`<div class="m"><small>Rentabilidad por dividendo</small><strong>${num(dd/dp*100,2)} %</strong></div><p class="sm">Cobras ${u(dd*dn)} al año con ${num(dn,0)} acciones (invertido: ${u(dp*dn)}).<br>${f5.join(" · ")}<br>Cobrado en 10 años: ${u(t)}</p>`)}else set("d_out","");
  const i0=n("i_i"),mm=n("i_m"),ir=n("i_r")/100/12,yy=Math.min(n("i_y"),80);let a=i0;for(let k=0;k<yy*12;k++)a=a*(1+ir)+mm;const ap=i0+mm*yy*12;
  set("i_out",`<div class="m"><small>Valor final</small><strong>${u(a)}</strong></div><p class="sm">Aportado: ${u(ap)} · Ganancia: <strong class="${a>=ap?"up":"dn"}">${u(a-ap)}</strong></p>`);
}
/* --- mapa de valor (treemap) --- */
function squarify(it,x,y,w,h){const out=[];let rest=it.slice();
  while(rest.length){const sh=Math.min(w,h);let row=[],s=0,best=Infinity,i=0;
    const worst=(r,sum)=>{const mx=r[0].a,mn=r[r.length-1].a;return Math.max(sh*sh*mx/(sum*sum),sum*sum/(sh*sh*mn))};
    while(i<rest.length){const nr=row.concat(rest[i]),ns=s+rest[i].a,wv=worst(nr,ns);if(row.length&&wv>best)break;row=nr;s=ns;best=wv;i++}
    rest=rest.slice(i);const th=s/sh;let off=0;

  const txt=sh<=35?`<strong class="up">Está más barata de lo habitual.</strong> Solo el ${num(sh,0)} % de los días de los últimos 5 años cotizó igual o más barata.`:sh>=65?`<strong class="dn">Está más cara de lo habitual.</strong> El ${num(100-sh,0)} % de los días de los últimos 5 años cotizó más cara.`:`<strong>Cotiza en la zona habitual de su propio historial</strong> (más barata que el ${num(100-sh,0)} % de los días y más cara que el ${num(sh,0)} % de los últimos 5 años).`;
  return `<div class="box"><div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap"><div style="flex:1;min-width:240px">${txt}<div class="sm">Compara el precio de hoy solo con su propio pasado, no con su valor.</div></div>
  <div style="flex:1;min-width:200px"><div style="position:relative;height:10px;border-radius:6px;background:linear-gradient(90deg,var(--up),var(--p2) 50%,var(--dn))"><div style="position:absolute;top:-4px;left:calc(${sh.toFixed(0)}% - 4px);width:8px;height:18px;border-radius:3px;background:var(--t);border:2px solid var(--bg)"></div></div><div class="flex sm" style="margin-top:4px"><span>más barata</span><span>más cara</span></div></div></div></div>`;
}
function fGrafico(t,raw,c,v){
  const el=document.getElementById("fch");if(!el)return;
  if(typeof LightweightCharts==="undefined"){el.innerHTML='<p class="sm">No se pudo cargar la librería del gráfico. Recarga la página con Ctrl+F5.</p>';return}

  const up=data[data.length-1].value>=data[0].value,col=up?th.up:th.dn;

  if(c&&c.iv){
    s.createPriceLine({price:c.iv,color:th.gold,lineWidth:1,lineStyle:2,axisLabelVisible:true,title:"Valor base"});
    s.createPriceLine({price:c.entry,color:th.g,lineWidth:1,lineStyle:2,axisLabelVisible:true,title:"Entrada (-25 %)"});
    if(v.esc&&v.esc.length===3){s.createPriceLine({price:v.esc[0],color:th.dn,lineWidth:1,lineStyle:3,axisLabelVisible:true,title:"Bajista"});s.createPriceLine({price:v.esc[2],color:th.up,lineWidth:1,lineStyle:3,axisLabelVisible:true,title:"Alcista"})}
  }
  const R={"6M":182,"1A":365,"5A":1826,"Máx.":99999},rng=document.getElementById("frng");
  const set=k=>{const last=new Date(data[data.length-1].time),f=data.filter(x=>new Date(x.time)>=new Date(last-R[k]*864e5));s.setData(f.length>1?f:data);chart.timeScale().fitContent();[...rng.children].forEach(b=>b.classList.toggle("on",b.textContent===k))};
  Object.keys(R).forEach(k=>{const b=document.createElement("button");b.className="btn";b.textContent=k;b.onclick=()=>set(k);rng.appendChild(b)});

function fMetodos(v,c,p){

}
/* --- series y cuentas --- */
const fAvg=a=>a.length?a.reduce((s,x)=>s+x,0)/a.length:null;
const fLastN=(a,n)=>(a||[]).filter(x=>x!=null).slice(-n);
function fRat(num_,den_,f){const a=[];for(let i=0;i<num_.length;i++){const x=num_[i],y=den_?.[i];a.push(x==null||y==null||y===0?null:f?f(x,y):x/y)}return a}
function fCalidad(fd){
  const st=fd&&fd.st;if(!st)return"";
  const I=st.is||{},B=st.bs||{},C=st.cf||{};
  const ni=I["Beneficio neto"],eq=B["Patrimonio neto"],rev=I["Ingresos"],op=I["Resultado operativo"],fcl=C["Flujo de caja libre"];
  const ok=(c,x)=>({t:"ok",x}),wr=(x)=>({t:"warn",x}),bd=x=>({t:"bad",x});
  const rent=[],sol=[];
  if(ni&&eq){const r=fLastN(fRat(ni,eq,(a,b)=>b>0?a/b:null),3);if(r.length){const m=fAvg(r);rent.push(m>=.15?ok(0,`ROE medio de 3 años de ${pc1(m)}: rinde muy bien el dinero de los accionistas.`):m>0?wr(`ROE medio de 3 años de ${pc1(m)}: positivo, pero moderado.`):bd(`ROE medio de 3 años de ${pc1(m)}: no está rindiendo el dinero de los accionistas.`))}}
  if(ni){const l=fLastN(ni,5);if(l.length>=3)rent.push(l.every(x=>x>0)?ok(0,"Ha ganado dinero todos los últimos años."):l.filter(x=>x<=0).length===1?wr("Tuvo pérdidas en alguno de los últimos años."):bd("Ha tenido pérdidas en varios de los últimos años."))}
  if(op&&rev){const r=fLastN(fRat(op,rev),3);if(r.length){const m=fAvg(r);rent.push(m>=.15?ok(0,`Margen operativo medio de ${pc1(m)}: el negocio es muy rentable.`):m>=.07?wr(`Margen operativo medio de ${pc1(m)}: rentabilidad media.`):bd(`Margen operativo medio de ${pc1(m)}: el negocio deja poco margen.`))}}
  if(fcl&&rev){const r=fLastN(fRat(fcl,rev),3);if(r.length){const m=fAvg(r);rent.push(m>=.10?ok(0,`Margen de caja libre medio de ${pc1(m)}: genera mucho dinero real.`):m>=.04?wr(`Margen de caja libre medio de ${pc1(m)}: genera algo de dinero real.`):bd(`Margen de caja libre medio de ${pc1(m)}: apenas le sobra dinero.`))}}
  const dcp=B["Deuda a corto plazo"],dlp=B["Deuda a largo plazo"];
  if(eq&&(dcp||dlp)){const d=eq.map((_,i)=>(dcp?.[i]??0)+(dlp?.[i]??0));const r=fLastN(fRat(d,eq,(a,b)=>b>0?a/b:null),1);if(r.length){const x=r[0];sol.push(x<=.5?ok(0,`Deuda de ${num(x,2)} veces su patrimonio: poca deuda.`):x<=1.2?wr(`Deuda de ${num(x,2)} veces su patrimonio: nivel medio.`):bd(`Deuda de ${num(x,2)} veces su patrimonio: bastante endeudada.`))}}
  const ac=B["Activo corriente"],pcor=B["Pasivo corriente"];
  if(ac&&pcor){const r=fLastN(fRat(ac,pcor),1);if(r.length){const x=r[0];sol.push(x>=1.5?ok(0,`Liquidez de ${num(x,1)}: cubre con holgura lo que debe a menos de un año.`):x>=1?wr(`Liquidez de ${num(x,2)}: justa a corto plazo.`):bd(`Liquidez de ${num(x,2)}: lo que debe a menos de un año supera lo que tiene disponible.`))}}
  const it=I["Gastos por intereses"];
  if(op&&it){const r=fLastN(fRat(op,it,(a,b)=>b>0?a/b:null),1);if(r.length){const x=r[0];sol.push(x>=8?ok(0,`Cobertura de intereses de ${num(x,1)} veces: paga sus intereses con mucha holgura.`):x>=3?wr(`Cobertura de intereses de ${num(x,1)} veces: cómoda, sin exceso.`):bd(`Cobertura de intereses de ${num(x,1)} veces: los intereses se llevan buena parte de lo que gana.`))}}
  if(fcl&&(dcp||dlp)){const d=fLastN(eq?eq.map((_,i)=>(dcp?.[i]??0)+(dlp?.[i]??0)):[],1)[0],f=fLastN(fcl,1)[0];if(d!=null&&f!=null){sol.push(d<=0?ok(0,"No tiene deuda financiera relevante."):f<=0?bd("Genera poca caja libre para pagar su deuda."):d/f<=3?ok(0,`Podría pagar toda su deuda con ${num(d/f,1)} años de caja libre.`):d/f<=6?wr(`Necesitaría ${num(d/f,1)} años de caja libre para pagar su deuda.`):bd(`Necesitaría ${num(d/f,1)} años de caja libre para pagar su deuda.`))}}
  const sc=L=>L.length?Math.round(L.reduce((s,x)=>s+({ok:2,warn:1,bad:0}[x.t]),0)/(2*L.length)*100):null;
  const ico={ok:'<span class="up">✔</span>',warn:'<span style="color:var(--y)">⚠</span>',bad:'<span class="dn">✖</span>'};
  const bx=(tit,L,s)=>L.length?`<div class="m" style="text-align:left;flex:1;min-width:260px"><div class="flex"><b>${tit}</b><span style="font-size:26px;font-weight:700;color:${s>=70?"var(--up)":s>=45?"var(--y)":"var(--dn)"}">${s}<small class="sm"> /100</small></span></div>${L.map(i=>`<div style="margin:5px 0;font-size:13px">${ico[i.t]} ${esc(i.x)}</div>`).join("")}</div>`:"";
  if(!rent.length&&!sol.length)return"";
  return `<div class="box"><h3>Calidad de la empresa</h3><div class="row" style="align-items:stretch;flex-wrap:wrap;gap:12px">${bx("Rentabilidad",rent,sc(rent))}${bx("Solvencia",sol,sc(sol))}</div><p class="sm" style="margin-top:8px">Puntuaciones nuestras, de 0 a 100, con reglas fijas iguales para todas las empresas y cuentas oficiales. <a href="aprender.html#g-puntuacion" target="_blank" rel="noopener">Cómo se calculan</a>.</p></div>`;
}
function fMoney(v){return v==null?"—":Math.abs(v)>=1000?"$"+num(v/1000,2)+" mil M":"$"+fN(v,0)+" M"}
function fFinanzas(fd){
  const st=fd&&fd.st;
  if(!fd)return `<div class="box"><h3>Cuentas de la empresa</h3><p class="sm">Para esta empresa no hay cuentas anuales disponibles en el formato que usamos (bancos, aseguradoras, fondos y algunas empresas extranjeras).</p></div>`;
  if(!st)return `<div class="box"><h3>Cuentas de la empresa</h3><p class="sm">Los estados financieros completos se añadirán en la próxima actualización semanal.</p><div id="fund2"></div></div>`;
  const I=st.is,C=st.cf,pick=[["Ingresos",I],["Resultado operativo",I],["Beneficio neto",I],["Beneficio por acción",I],["Flujo de caja operativo",C],["Flujo de caja libre",C]].filter(([k,s])=>s&&s[k]&&s[k].some(x=>x!=null));
  const spark=a=>{const v=a.map(x=>x??0),mx=Math.max(...v.map(Math.abs),1),w=Math.max(10,Math.floor(190/v.length)-3);return `<svg width="${v.length*(w+3)}" height="34">${v.map((x,i)=>{const hh=Math.max(1.5,30*Math.abs(x)/mx);return `<rect x="${i*(w+3)}" y="${32-hh}" width="${w}" height="${hh}" rx="2" fill="${x<0?"#f23645":i===v.length-1?"var(--gold)":"#5b6b8c"}"/>`}).join("")}</svg>`};
  const cagr=(a,n)=>{const i=a.length-1-n,l=a[a.length-1];if(i<0||a[i]==null||l==null||a[i]<=0||l<=0)return null;return Math.pow(l/a[i],1/n)-1};
  const cards=pick.map(([k,s])=>{const a=s[k],last=fLastN(a,1)[0],isE=k==="Beneficio por acción";
    return `<div class="m" style="text-align:left"><small>${gl(k)}</small><strong style="font-size:20px">${isE?"$"+num(last,2):fMoney(last)}</strong>
    <div class="row" style="gap:5px;margin:4px 0">${[3,5,10].map(n=>{const g=cagr(a,n);return `<span class="pill ${g==null?"":g>=0?"up":"dn"}" title="Crecimiento medio anual a ${n} años">${n}A ${g==null?"—":(g>=0?"+":"")+num(g*100,1)+" %"}</span>`}).join("")}</div>${spark(a)}</div>`}).join("");
  return `<div class="box"><h3>Finanzas</h3><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(230px,1fr))">${cards}</div>
  <p class="sm" style="margin:6px 0">Crecimiento medio anual a 3, 5 y 10 años (último ejercicio completo frente a hace 3, 5 o 10 años). Barras: ${st.y.join(", ")}. <a href="aprender.html#g-crecimiento" target="_blank" rel="noopener">Qué es</a></p>
  <h3 style="margin-top:14px">Estados financieros</h3><div class="row" id="ftabs" style="margin:6px 0"></div><div id="ftab" style="overflow-x:auto"></div>
  <p class="sm" style="margin-top:6px">Cuentas anuales oficiales (SEC), en millones de dólares salvo el beneficio por acción. Pulsa en cualquier línea para ver qué significa. Las líneas en cursiva las calculamos nosotros.</p></div>`;
}
function fTabs(){
  const T=[["is","Cuenta de resultados"],["bs","Balance"],["cf","Flujo de caja"]];
  document.getElementById("ftabs").innerHTML=T.map(([k,l])=>`<button class="btn${FTAB===k?" on":""}" onclick="FTAB='${k}';fTabs()">${l}</button>`).join("");
  const st=FD.st,S=st[FTAB]||{},y=st.y;
  const rows=[],f0=(a,e)=>a.map(x=>x==null?"—":fN(x,e)),pct=a=>a.map(x=>x==null?"—":num(x*100,1)+" %");
  const add=(k,a,d=0)=>{if(a&&a.some(x=>x!=null))rows.push(`<tr><td class="stk">${gl(k)}</td>${f0(a,d).map(x=>`<td>${x}</td>`).join("")}</tr>`)};
  const calcRow=(k,a,fmt)=>{if(a&&a.some(x=>x!=null))rows.push(`<tr class="calc"><td class="stk"><i>${gl(k)}</i></td>${fmt(a).map(x=>`<td><i>${x}</i></td>`).join("")}</tr>`)};
  const I=st.is||{},B=st.bs||{},C=st.cf||{};
  if(FTAB==="is"){
    ["Ingresos","Coste de ventas","Beneficio bruto","Investigación y desarrollo","Gastos comerciales y generales","Resultado operativo","Gastos por intereses","Beneficio antes de impuestos","Impuestos","Beneficio neto"].forEach(k=>add(k,I[k]));
    add("Beneficio por acción",I["Beneficio por acción"],2);add("Acciones (millones)",I["Acciones (millones)"],1);
    calcRow("Margen bruto",fRat(I["Beneficio bruto"]||[],I["Ingresos"]),pct);calcRow("Margen operativo",fRat(I["Resultado operativo"]||[],I["Ingresos"]),pct);calcRow("Margen neto",fRat(I["Beneficio neto"]||[],I["Ingresos"]),pct);
  }else if(FTAB==="bs"){
    ["Caja","Inversiones a corto plazo","Cuentas por cobrar","Inventarios","Activo corriente","Inmovilizado material","Fondo de comercio","Activos totales","Cuentas por pagar","Deuda a corto plazo","Pasivo corriente","Deuda a largo plazo","Pasivos totales","Patrimonio neto"].forEach(k=>add(k,B[k]));
    const eq=B["Patrimonio neto"];
    if(eq&&(B["Deuda a corto plazo"]||B["Deuda a largo plazo"]))calcRow("Deuda sobre patrimonio",eq.map((e,i)=>e>0?((B["Deuda a corto plazo"]?.[i]??0)+(B["Deuda a largo plazo"]?.[i]??0))/e:null),a=>a.map(x=>x==null?"—":num(x,2)));
    calcRow("Liquidez corriente",fRat(B["Activo corriente"]||[],B["Pasivo corriente"]),a=>a.map(x=>x==null?"—":num(x,2)));
    calcRow("ROE",fRat(I["Beneficio neto"]||[],eq,(a,b)=>b>0?a/b:null),pct);
  }else{
    ["Flujo de caja operativo","Inversión en activos (capex)","Flujo de caja libre","Flujo de inversión","Dividendos pagados","Recompra de acciones","Flujo de financiación"].forEach(k=>add(k,C[k]));
    calcRow("Margen de caja libre",fRat(C["Flujo de caja libre"]||[],I["Ingresos"]),pct);
  }
  document.getElementById("ftab").innerHTML=rows.length?`<table class="fs"><tr><th></th>${y.map(x=>`<th>${x}</th>`).join("")}</tr>${rows.join("")}</table>`:'<p class="sm">Sin datos de este informe para la empresa.</p>';
}
