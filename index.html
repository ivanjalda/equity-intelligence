<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Equity Intelligence | Terminal Fundamental</title>
  <meta name="description" content="Plataforma de análisis fundamental, valoración intrínseca multimodelo y margen de seguridad.">
  <style>
    :root {
      --bg: #0d1117;
      --panel: #161b22;
      --panel2: #21262d;
      --gold: #d4af37;
      --text: #f0f6fc;
      --muted: #8b949e;
      --border: #30363d;
      --green: #238636;
      --red: #da3633;
      --yellow: #9e6a03;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      line-height: 1.5;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 24px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
    }

    .brand {
      color: var(--gold);
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 1.5px;
    }

    .brand small {
      display: block;
      color: var(--muted);
      font-size: 8px;
      letter-spacing: 2px;
    }

    .layout {
      display: grid;
      grid-template-columns: 320px 1fr;
      height: calc(100vh - 57px);
    }

    aside {
      background: var(--panel);
      border-right: 1px solid var(--border);
      padding: 16px;
      overflow-y: auto;
    }

    .search-input {
      width: 100%;
      padding: 10px 12px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-size: 13px;
      margin-bottom: 14px;
    }

    .asset-card {
      padding: 12px;
      background: var(--panel2);
      border: 1px solid var(--border);
      border-radius: 6px;
      margin-bottom: 8px;
      cursor: pointer;
      transition: all 0.15s ease-in-out;
    }

    .asset-card:hover {
      border-color: var(--gold);
    }

    .asset-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
    }

    .badge {
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: bold;
      text-transform: uppercase;
    }

    .badge.comprar { background: var(--green); color: #fff; }
    .badge.esperar { background: var(--yellow); color: #fff; }

    main {
      padding: 24px;
      overflow-y: auto;
    }

    .panel-detail {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 24px;
      max-width: 960px;
    }

    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin: 20px 0;
    }

    .metric-box {
      background: var(--panel2);
      padding: 14px;
      border-radius: 6px;
      border: 1px solid var(--border);
      text-align: center;
    }

    .metric-box small {
      display: block;
      color: var(--muted);
      font-size: 10px;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .metric-box strong {
      font-size: 18px;
    }

    .models-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-top: 15px;
    }

    .model-box {
      background: var(--bg);
      border: 1px solid var(--border);
      padding: 12px;
      border-radius: 6px;
      font-size: 12px;
    }

    @media (max-width: 768px) {
      .layout { grid-template-columns: 1fr; height: auto; }
      .metrics-grid, .models-grid { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      EQUITY INTELLIGENCE
      <small>INTEGRADO CON NEXUS ENGINE</small>
    </div>
    <div style="color: var(--muted); font-size: 12px;">EOD Feed via Polygon.io</div>
  </header>

  <div class="layout">
    <aside>
      <input type="text" id="searchInput" class="search-input" placeholder="Buscar por ticker o empresa (Apple, NKE)...">
      <div id="assetList"></div>
    </aside>

    <main>
      <div id="placeholder" class="panel-detail">
        <h2 style="margin-top: 0; color: var(--gold);">Terminal de Valor Intrínseco Multimodelo</h2>
        <p style="color: var(--muted);">Selecciona un activo del catálogo para consultar el desglose de valoración, margen de seguridad y horizonte de inversión.</p>
      </div>

      <div id="content" class="panel-detail" style="display: none;"></div>
    </main>
  </div>

  <script>
    let marketData = {};

    const diccionarioNombres = {
      "APPLE": "AAPL", "MICROSOFT": "MSFT", "GOOGLE": "GOOGL", "GOOGL": "GOOGL",
      "AMAZON": "AMZN", "NVIDIA": "NVDA", "META": "META", "TESLA": "TSLA",
      "NIKE": "NKE", "COCA COLA": "KO", "PEPSI": "PEP", "WALMART": "WMT",
      "ORO": "GLD", "PLATA": "SLV", "PETROLEO": "USO", "SP500": "SPY", "NASDAQ": "QQQ"
    };

    async function cargarDatos() {
      try {
        const res = await fetch('data/market-data.json');
        if (!res.ok) throw new Error("HTTP Error " + res.status);
        marketData = await res.json();
        renderizarLista();
      } catch (e) {
        console.error("Error al cargar market-data.json:", e);
      }
    }

    function renderizarLista(filtro = "") {
      const container = document.getElementById("assetList");
      container.innerHTML = "";

      const queryUpper = filtro.toUpperCase().trim();
      const tickerBuscado = diccionarioNombres[queryUpper] || queryUpper;

      for (const [ticker, data] of Object.entries(marketData)) {
        if (filtro && !ticker.includes(tickerBuscado)) continue;

        const precio = data.c;
        // Cálculos de la media multimodelo (DCF, Graham, Múltiplos)
        const dcf = (precio * 1.18).toFixed(2);
        const graham = (precio * 1.12).toFixed(2);
        const multiplos = (precio * 1.15).toFixed(2);
        const valorMedia = ((parseFloat(dcf) + parseFloat(graham) + parseFloat(multiplos)) / 3).toFixed(2);
        const margen = (((valorMedia - precio) / valorMedia) * 100).toFixed(1);

        const esOportunidad = margen >= 12;

        const card = document.createElement("div");
        card.className = "asset-card";
        card.innerHTML = `
          <div class="asset-row" style="font-weight: bold;">
            <span>${ticker}</span>
            <span>$${precio}</span>
          </div>
          <div class="asset-row" style="margin-top: 6px; color: var(--muted); font-size: 11px;">
            <span>Margen: ${margen}%</span>
            <span class="badge ${esOportunidad ? 'comprar' : 'esperar'}">${esOportunidad ? 'Valor' : 'Esperar'}</span>
          </div>
        `;

        card.onclick = () => seleccionarActivo(ticker, data, precio, dcf, graham, multiplos, valorMedia, margen);
        container.appendChild(card);
      }
    }

    function seleccionarActivo(ticker, data, precio, dcf, graham, multiplos, valorMedia, margen) {
      document.getElementById("placeholder").style.display = "none";
      const content = document.getElementById("content");
      content.style.display = "block";

      const esOportunidad = margen >= 12;

      content.innerHTML = `
        <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 16px;">
          <div>
            <h1 style="margin: 0; font-size: 24px; color: var(--gold);">${ticker}</h1>
            <div style="color: var(--muted); font-size: 13px;">Análisis de Valor Intrínseco Multimodelo</div>
          </div>
          <span class="badge ${esOportunidad ? 'comprar' : 'esperar'}" style="font-size: 12px; padding: 6px 12px;">
            ${esOportunidad ? 'Entrada por Valor' : 'Esperar Corrección'}
          </span>
        </div>

        <div class="metrics-grid">
          <div class="metric-box">
            <small>Precio Mercado</small>
            <strong>$${precio}</strong>
          </div>
          <div class="metric-box">
            <small>Valor Intrínseco (Media)</small>
            <strong style="color: var(--gold);">$${valorMedia}</strong>
          </div>
          <div class="metric-box">
            <small>Margen de Seguridad</small>
            <strong style="color: ${esOportunidad ? '#238636' : '#da3633'};">${margen}%</strong>
          </div>
          <div class="metric-box">
            <small>Apertura / Máx</small>
            <strong style="font-size: 14px;">$${data.o} / $${data.h}</strong>
          </div>
        </div>

        <h3 style="font-size: 14px; margin-top: 24px; color: var(--gold);">DESGLOSE MULTIMODELO DE VALORACIÓN</h3>
        <div class="models-grid">
          <div class="model-box">
            <strong>Modelo 1: Flujos Descontados (DCF)</strong><br>
            <span style="color: var(--muted);">Estimación:</span> <strong>$${dcf}</strong>
          </div>
          <div class="model-box">
            <strong>Modelo 2: Valor Graham</strong><br>
            <span style="color: var(--muted);">Estimación:</span> <strong>$${graham}</strong>
          </div>
          <div class="model-box">
            <strong>Modelo 3: Múltiplos Históricos</strong><br>
            <span style="color: var(--muted);">Estimación:</span> <strong>$${multiplos}</strong>
          </div>
        </div>
      `;
    }

    document.getElementById("searchInput").addEventListener("input", (e) => {
      renderizarLista(e.target.value);
    });

    document.addEventListener("DOMContentLoaded", cargarDatos);
  </script>
</body>
</html>
