name: Noticias de mercado

on:
  schedule:
    - cron: "15 */3 * * *"   # cada 3 horas
  workflow_dispatch:          # permite ejecutarlo a mano

permissions:
  contents: write

concurrency:
  group: equity-news
  cancel-in-progress: false

jobs:
  noticias:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Leer titulares
        env:
          SEC_USER_AGENT: "EquityIntelligence community16jalda@gmail.com"
        run: python scripts/news.py
      - name: Guardar resultados
        run: |
          git config user.name "equity-bot"
          git config user.email "equity-bot@users.noreply.github.com"
          git add data/news.json
          git diff --cached --quiet || (git commit -m "Noticias $(date -u +%FT%H:%M)" && git pull --rebase origin main && git push)
